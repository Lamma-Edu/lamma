<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لمّة</title>
<style>
  :root {
    --bg: #f3f1ea;
    --card: #fbfaf6;
    --ink: #2a3a33;
    --muted: #6b7a72;
    --green: #3f7d5c;
    --green-ink: #ffffff;
    --red: #b5483c;
    --line: #d9d5c8;
    --panel: #ebe8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17201b;
      --card: #1d2922;
      --ink: #e8eee9;
      --muted: #9fb0a6;
      --green: #6fbf93;
      --green-ink: #10281c;
      --red: #e0806f;
      --line: #33443a;
      --panel: #202c25;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif;
    display: grid;
    place-items: start center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 400px; text-align: center; }
  main.wide { max-width: 760px; }
  h1 {
    font-size: clamp(3rem, 12vw, 4.4rem);
    margin: 8px 0 4px;
    color: var(--green);
    font-weight: 700;
    line-height: 1.2;
  }
  .tagline { margin: 0 0 24px; color: var(--muted); font-size: 1.05rem; }
  h2 { margin: 0 0 12px; font-size: 1.25rem; }
  h3 { margin: 8px 0 0; font-size: 1.02rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    text-align: right;
  }
  .card + .card, .card + div { margin-top: 14px; }
  .inner { margin-bottom: 18px; }
  .tabs, .tabbar {
    background: var(--panel);
    padding: 5px;
    border-radius: 12px;
  }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
  .tabbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .tabbar .tab { flex: 1 1 auto; }
  .tab {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; }
  label { display: block; font-size: .9rem; margin: 14px 0 6px; }
  input, select, textarea {
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; }
  textarea { min-height: 110px; resize: vertical; margin-top: 8px; }
  input[type="email"], input[type="password"] { direction: ltr; text-align: left; }
  input.num { width: 90px; text-align: center; padding: 8px; }
  select { padding: 9px 10px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  .tab:focus-visible, .btn:focus-visible, .linkbtn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: var(--green-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.small { width: auto; margin-top: 0; padding: 8px 16px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost-red { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .linkbtn {
    background: none; border: 0; color: var(--green); font: inherit;
    cursor: pointer; padding: 8px 0; text-decoration: underline;
  }
  .msg { min-height: 1.4em; margin: 14px 0 0; font-size: .92rem; }
  .msg.error { color: var(--red); }
  .msg.ok { color: var(--green); }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 6px; }
  .detail {
    display: block; direction: ltr; text-align: left; color: var(--muted);
    font-size: .75rem; margin-top: 6px; word-break: break-word;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .ltr { direction: ltr; text-align: left; }

  .welcome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .welcome h2 { margin: 0; }
  .welcome .grow { flex: 1 1 200px; }
  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    background: var(--panel); color: var(--ink); font-size: .8rem;
  }
  .badge.alt { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .row {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1 1 200px; min-width: 0; }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item p { white-space: pre-wrap; margin: 8px 0; }
  .item .reply { color: var(--green); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cards { display: grid; gap: 10px; }
  .scard {
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    text-align: right; width: 100%; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .scard:hover { border-color: var(--green); }
  .scard:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .scard.is-new { border-inline-start: 4px solid var(--green); }
  .stitle { font-size: 1.02rem; }
  .sprev { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .readbox {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; line-height: 1.9; white-space: pre-wrap; font-size: 1.02rem; margin: 12px 0;
  }
  .replybox { border-inline-start: 4px solid var(--green); background: var(--panel); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .replybox p { white-space: pre-wrap; margin: 6px 0 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .actions { margin-top: 14px; }
  :root { --gold: #a97a1f; --gold-soft: rgba(169,122,31,.12); }
  @media (prefers-color-scheme: dark) { :root { --gold: #e3b95c; --gold-soft: rgba(227,185,92,.14); } }
  .badge.founder { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); font-weight: 600; }
  body.founder .welcome { border-color: var(--gold); }
  .banner {
    border: 1px solid var(--gold); border-radius: 16px; padding: 22px; text-align: right; margin-top: 14px;
    background: linear-gradient(135deg, var(--gold-soft), transparent 70%), var(--card);
    animation: rise .5s ease both;
  }
  .banner:empty { display: none; }
  .crown { display: inline-block; width: 30px; height: 30px; color: var(--gold); }
  .crown svg { width: 100%; height: 100%; display: block; }
  .banner h2 { color: var(--gold); margin: 6px 0 4px; font-size: 1.35rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel); border-radius: 12px; padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 1.5rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .stat.hot b { color: var(--gold); }
  .replybox { border-inline-start-color: var(--gold); }
  .replybox strong { color: var(--gold); }
  .replybox .crown { width: 18px; height: 18px; vertical-align: -3px; margin-inline-end: 6px; }
  .gate {
    position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; text-align: center;
    background: #0f1613; color: #f3e7c6; cursor: pointer; animation: gatein .4s ease both;
  }
  .gate .crown { width: 76px; height: 76px; color: #e3b95c; margin: 0 auto; }
  .gate h2 { font-size: clamp(1.7rem, 6vw, 2.5rem); margin: 16px 0 6px; color: #f3e7c6; }
  .gate p { margin: 0; color: #c9b98a; }
  .gate.out { animation: gateout .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes gatein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gateout { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .banner, .gate, .gate.out { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="main">
  <h1>لمّة</h1>
  <p class="tagline">منصة تعليمية سودانية — قريباً</p>

  <!-- تسجيل الدخول وإنشاء حساب -->
  <section class="card" id="authView">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" type="button">تسجيل الدخول</button>
      <button class="tab" role="tab" id="tabSignup" aria-selected="false" type="button">إنشاء حساب</button>
    </div>

    <div id="nameRow" hidden>
      <label for="fullName">الاسم الكامل</label>
      <input id="fullName" type="text" autocomplete="name">
    </div>

    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">

    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="hint" id="pwHint" hidden>8 أحرف على الأقل</div>

    <button class="btn" id="submitBtn" type="button">دخول</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <small class="detail" id="detail"></small>
    <button class="linkbtn" id="resendBtn" type="button" hidden>إعادة إرسال رسالة التأكيد</button>
    <div><button class="linkbtn" id="forgotLink" type="button">نسيت كلمة المرور؟</button></div>
  </section>

  <!-- استعادة كلمة المرور -->
  <section class="card" id="forgotView" hidden>
    <h2>استعادة كلمة المرور</h2>
    <label for="fEmail">البريد الإلكتروني</label>
    <input id="fEmail" type="email" autocomplete="email" inputmode="email">
    <button class="btn" id="fSend" type="button">إرسال رابط الاستعادة</button>
    <p class="msg" id="fMsg" role="status" aria-live="polite"></p>
    <button class="linkbtn" id="fBack" type="button">العودة إلى تسجيل الدخول</button>
  </section>

  <!-- كلمة مرور جديدة -->
  <section class="card" id="recoveryView" hidden>
    <h2>كلمة مرور جديدة</h2>
    <label for="rPass">كلمة المرور الجديدة</label>
    <input id="rPass" type="password" autocomplete="new-password">
    <label for="rPass2">أعد كتابتها</label>
    <input id="rPass2" type="password" autocomplete="new-password">
    <div class="hint">8 أحرف على الأقل</div>
    <button class="btn" id="rSave" type="button">حفظ</button>
    <p class="msg" id="rMsg" role="status" aria-live="polite"></p>
  </section>

  <!-- بعد الدخول -->
  <section id="appView" hidden>
    <div class="card welcome">
      <div class="grow">
        <h2 id="welcomeName"></h2>
        <span class="badge" id="roleBadge"></span>
      </div>
      <button class="btn secondary small" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="tabbar" id="tabBar" role="tablist"></div>
    <p class="msg" id="panelMsg" role="status" aria-live="polite"></p>
    <div class="card" id="tabBody"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Public values only. Never put a secret key (sb_secret_ or service_role) here.
  const SUPABASE_URL = "https://abdnfozkxoexcivplhcr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PI3MB7MGuXuuXIXBEFI7ew_3MSZgiHd";

  // Read link errors / recovery flag BEFORE the client touches the URL.
  let recoveryMode = location.hash.includes("type=recovery");
  const hashErrorCode = (function () {
    if (!location.hash || location.hash.length < 2) return null;
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.get("error") && !p.get("error_code")) return null;
    const code = p.get("error_code") || p.get("error");
    history.replaceState(null, "", location.pathname + location.search);
    return code;
  })();

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);

  // ---------- helpers ----------
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (k === "class") e.className = v;
        else e.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      e.append(kid.nodeType ? kid : String(kid));
    }
    return e;
  }
  function setMsg(id, text, type) {
    const m = $(id);
    m.textContent = text;
    m.className = "msg" + (type ? " " + type : "");
  }
  const showMsg = (t, type) => setMsg("msg", t, type);
  const notify = (t, type) => setMsg("panelMsg", t, type);
  function show(id) {
    ["authView", "forgotView", "recoveryView", "appView"].forEach((v) => { $(v).hidden = v !== id; });
    $("main").classList.toggle("wide", id === "appView");
  }
  function fmtDate(d) { return new Date(d).toLocaleDateString("ar-EG"); }

  // Static, trusted SVG (no user content).
  const CROWN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>';
  function crownEl() {
    const c = document.createElement("span");
    c.className = "crown";
    c.innerHTML = CROWN_SVG;
    return c;
  }
  function timeGreeting() {
    const h = new Date().getHours();
    if (h >= 5 && h < 12) return "صباح الخير";
    if (h >= 12 && h < 18) return "طاب يومك";
    return "مساء الخير";
  }

  const ROLE_LABEL = {
    founder: "المؤسس", chief: "مشرف رئيسي", technical: "مشرف فني",
    assistant: "مشرف مساعد", student: "طالب"
  };
  const CAT_LABEL = {
    lessons: "المواد والدروس", teaching: "طريقة التدريس", student_experience: "تجربة الطالب",
    technical: "الجانب التقني", supervisors: "بيئة عمل المشرفين", other: "أخرى"
  };
  const STATUS_LABEL = {
    new: "جديد", reviewing: "قيد الدراسة", accepted: "مقبول", rejected: "مرفوض", done: "نُفِّذ"
  };
  const REQ_STATUS = { pending: "بانتظار قرارك", approved: "مقبول", rejected: "مرفوض" };

  function friendlyError(err) {
    const m = ((err && err.message) || "").toLowerCase();
    if (m.includes("invalid login")) return "البريد أو كلمة المرور غير صحيحة.";
    if (m.includes("email not confirmed")) return "لم يتم تأكيد بريدك بعد. افتح رسالة التأكيد، أو اطلب إعادة إرسالها.";
    if (m.includes("already registered")) return "هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.";
    if (m.includes("security purposes") || m.includes("rate limit") || m.includes("too many")) return "انتظر دقيقة ثم أعد المحاولة.";
    if (m.includes("password")) return "كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.";
    if (m.includes("expired") || m.includes("invalid")) return "انتهت صلاحية الرابط أو سبق استخدامه.";
    if (m.includes("fetch") || m.includes("network")) return "تعذّر الاتصال بالخادم. تحقق من الإنترنت.";
    return "حدث خطأ. أعد المحاولة بعد قليل.";
  }
  function rpcError(err) {
    const m = (err && err.message) || "";
    const map = {
      GLOBAL_LIMIT: "وصلت المنصة إلى الحد الأقصى لهذا المنصب.",
      PERSONAL_LIMIT: "وصلت إلى الحد المسموح لك من التعيينات.",
      NOT_ALLOWED: "ليس لديك صلاحية لهذا الإجراء.",
      TARGET_NOT_STUDENT: "يمكن تعيين الطلاب فقط.",
      TARGET_NOT_FOUND: "الحساب غير موجود.",
      BAD_ROLE: "صفة غير صحيحة.",
      REQUEST_NOT_FOUND: "الطلب غير موجود أو تم البت فيه.",
      UNKNOWN_LIMIT: "حد غير معروف.",
      BAD_STATUS: "حالة غير صحيحة.",
      NOT_FOUND: "العنصر غير موجود.",
      EMPTY_REPLY: "اكتب الرد أولاً."
    };
    for (const k of Object.keys(map)) if (m.includes(k)) return map[k];
    return "تعذّر تنفيذ الإجراء. أعد المحاولة.";
  }

  // ---------- تسجيل الدخول ----------
  let mode = "login";
  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    $("tabLogin").setAttribute("aria-selected", String(!signup));
    $("tabSignup").setAttribute("aria-selected", String(signup));
    $("nameRow").hidden = !signup;
    $("pwHint").hidden = !signup;
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("submitBtn").textContent = signup ? "إنشاء الحساب" : "دخول";
    $("resendBtn").hidden = true;
    $("detail").textContent = "";
    showMsg("");
  }

  async function submit() {
    const email = $("email").value.trim();
    const password = $("password").value;
    const fullName = $("fullName").value.trim();

    if (!email || !password) return showMsg("أدخل البريد وكلمة المرور.", "error");
    if (mode === "signup") {
      if (!fullName) return showMsg("أدخل اسمك الكامل.", "error");
      if (password.length < 8) return showMsg("كلمة المرور يجب ألا تقل عن 8 أحرف.", "error");
    }

    const btn = $("submitBtn");
    btn.disabled = true;
    showMsg("جاري المعالجة…");
    $("detail").textContent = "";
    $("resendBtn").hidden = true;
    try {
      if (mode === "signup") {
        const { data, error } = await db.auth.signUp({
          email, password,
          options: { data: { full_name: fullName }, emailRedirectTo: location.origin }
        });
        if (error) throw error;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          return showMsg("هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.", "error");
        }
        if (!data.session) {
          showMsg("تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد خلال ساعة، ثم سجّل الدخول.", "ok");
          $("resendBtn").hidden = false;
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      showMsg(friendlyError(e), "error");
      $("detail").textContent = (e && e.message) ? e.message : "";
      if (((e && e.message) || "").toLowerCase().includes("not confirmed")) $("resendBtn").hidden = false;
    } finally {
      btn.disabled = false;
    }
  }

  $("tabLogin").addEventListener("click", () => setMode("login"));
  $("tabSignup").addEventListener("click", () => setMode("signup"));
  $("submitBtn").addEventListener("click", submit);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  $("resendBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) return showMsg("اكتب بريدك في الخانة أولاً.", "error");
    const { error } = await db.auth.resend({ type: "signup", email, options: { emailRedirectTo: location.origin } });
    if (error) return showMsg(friendlyError(error), "error");
    showMsg("أُرسلت رسالة تأكيد جديدة. افتح بريدك.", "ok");
  });

  // ---------- نسيت كلمة المرور ----------
  $("forgotLink").addEventListener("click", () => { $("fEmail").value = $("email").value; setMsg("fMsg", ""); show("forgotView"); });
  $("fBack").addEventListener("click", () => show("authView"));
  $("fSend").addEventListener("click", async () => {
    const email = $("fEmail").value.trim();
    if (!email) return setMsg("fMsg", "اكتب بريدك.", "error");
    $("fSend").disabled = true;
    const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.origin });
    $("fSend").disabled = false;
    if (error) return setMsg("fMsg", friendlyError(error), "error");
    setMsg("fMsg", "إن كان البريد مسجّلاً لدينا فستصلك رسالة فيها رابط الاستعادة.", "ok");
  });

  $("rSave").addEventListener("click", async () => {
    const a = $("rPass").value, b = $("rPass2").value;
    if (a.length < 8) return setMsg("rMsg", "كلمة المرور يجب ألا تقل عن 8 أحرف.", "error");
    if (a !== b) return setMsg("rMsg", "الكلمتان غير متطابقتين.", "error");
    $("rSave").disabled = true;
    const { error } = await db.auth.updateUser({ password: a });
    $("rSave").disabled = false;
    if (error) return setMsg("rMsg", friendlyError(error), "error");
    recoveryMode = false;
    const { data } = await db.auth.getSession();
    if (data.session) { shownUser = null; route(data.session); } else show("authView");
  });

  // ---------- لوحة المستخدم ----------
  let reloadTab = () => {};
  let tabDefs = [];
  let currentRole = null;
  function setTabLabel(i, text) {
    if (tabDefs[i] && tabDefs[i].btn) tabDefs[i].btn.textContent = text;
  }

  function buildTabs(defs) {
    const bar = $("tabBar"), body = $("tabBody");
    tabDefs = defs;
    bar.replaceChildren();
    let current = null;
    async function select(d) {
      current = d;
      defs.forEach((x) => x.btn.setAttribute("aria-selected", String(x === d)));
      notify("");
      body.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      try {
        body.replaceChildren(await d.render());
      } catch (e) {
        body.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة."));
      }
    }
    defs.forEach((d) => {
      d.btn = el("button", { class: "tab", role: "tab", type: "button", "aria-selected": "false" }, d.label);
      d.btn.addEventListener("click", () => select(d));
      bar.append(d.btn);
    });
    reloadTab = () => current && select(current);
    if (defs.length) select(defs[0]);
  }

  // --- المؤسس: الحسابات ---
  async function accountsTab() {
    const [acc, lim] = await Promise.all([
      db.rpc("founder_list_accounts"),
      db.from("platform_limits").select("key,value")
    ]);
    if (acc.error) throw acc.error;
    const limits = Object.fromEntries((lim.data || []).map((l) => [l.key, l.value]));
    const count = (r) => acc.data.filter((a) => a.role === r).length;
    const supervisors = count("chief") + count("technical") + count("assistant");
    const wrap = el("div");
    wrap.append(
      el("p", null, el("strong", null, "إجمالي الحسابات: " + acc.data.length),
        " — طلاب: " + count("student") + " · مشرفون: " + supervisors + " · المؤسس: " + count("founder")),
      el("p", { class: "muted" },
        "رئيسيون " + count("chief") + "/" + (limits.max_chief ?? "؟") +
        " · فنيون " + count("technical") + "/" + (limits.max_technical ?? "؟") +
        " · مساعدون " + count("assistant") + "/" + (limits.max_assistant ?? "؟")));

    acc.data.forEach((a) => {
      const isFounder = a.role === "founder";
      const row = el("div", { class: "row" },
        el("div", { class: "grow" },
          el("strong", null, a.full_name || "—"),
          el("div", { class: "muted ltr" }, a.email || "")),
        el("span", { class: "badge" }, ROLE_LABEL[a.role] || a.role),
        Date.now() - new Date(a.created_at).getTime() < 864e5 ? el("span", { class: "badge founder" }, "جديد") : null);
      if (!isFounder) {
        const sel = el("select", null,
          ...["student", "assistant", "technical", "chief"].map((r) => el("option", { value: r }, ROLE_LABEL[r])));
        sel.value = a.role;
        const btn = el("button", { class: "btn small", type: "button" }, "حفظ");
        btn.addEventListener("click", async () => {
          const r = sel.value;
          if (r === a.role) return notify("لم يتغير شيء.", "");
          if (r === "student" && !confirm("إعفاء هذا المشرف وإعادته طالباً؟")) return;
          btn.disabled = true;
          const res = r === "student"
            ? await db.rpc("remove_supervisor", { p_target: a.id })
            : await db.rpc("appoint_supervisor", { p_target: a.id, p_role: r });
          btn.disabled = false;
          if (res.error) return notify(rpcError(res.error), "error");
          notify("تم الحفظ.", "ok");
          reloadTab();
        });
        row.append(sel, btn);
      }
      wrap.append(row);
    });
    return wrap;
  }

  // --- المؤسس: الحدود ---
  async function limitsTab() {
    const { data, error } = await db.from("platform_limits").select("key,value,note").order("key");
    if (error) throw error;
    const wrap = el("div");
    data.forEach((l) => {
      const inp = el("input", { type: "number", min: "0", value: String(l.value), class: "num" });
      const btn = el("button", { class: "btn small", type: "button" }, "حفظ");
      btn.addEventListener("click", async () => {
        const v = parseInt(inp.value, 10);
        if (Number.isNaN(v) || v < 0) return notify("أدخل رقماً صحيحاً.", "error");
        btn.disabled = true;
        const { error: e } = await db.rpc("set_limit", { p_key: l.key, p_value: v });
        btn.disabled = false;
        notify(e ? rpcError(e) : "تم الحفظ.", e ? "error" : "ok");
      });
      wrap.append(el("div", { class: "row" },
        el("div", { class: "grow" }, el("div", null, l.note || l.key), el("div", { class: "muted ltr" }, l.key)),
        inp, btn));
    });
    return wrap;
  }

  // --- المؤسس: طلبات التعيين ---
  async function requestsTab() {
    const { data, error } = await db.rpc("founder_list_requests");
    if (error) throw error;
    const wrap = el("div");
    if (!data.length) return el("p", { class: "muted" }, "لا توجد طلبات تعيين.");
    data.forEach((r) => {
      const item = el("div", { class: "item" },
        el("div", { class: "meta" },
          el("span", { class: "badge" }, ROLE_LABEL[r.new_role] || r.new_role),
          el("span", { class: "badge alt" }, REQ_STATUS[r.status] || r.status),
          el("span", { class: "muted" }, fmtDate(r.created_at))),
        el("p", null, (r.requester_name || "—") + " يقترح تعيين " + (r.target_name || "—") +
          " (" + (r.target_email || "") + ") بصفة " + (ROLE_LABEL[r.new_role] || r.new_role) + "."),
        r.note ? el("p", { class: "muted" }, r.note) : null);
      if (r.status === "pending") {
        const ok = el("button", { class: "btn small", type: "button" }, "قبول");
        const no = el("button", { class: "btn small ghost-red", type: "button" }, "رفض");
        const act = (approve) => async () => {
          ok.disabled = no.disabled = true;
          const { error: e } = await db.rpc("decide_request", { p_id: r.id, p_approve: approve });
          if (e) { ok.disabled = no.disabled = false; return notify(rpcError(e), "error"); }
          notify(approve ? "تم القبول والتعيين." : "تم الرفض.", "ok");
          reloadTab();
        };
        ok.addEventListener("click", act(true));
        no.addEventListener("click", act(false));
        item.append(el("div", { class: "row" }, ok, no));
      }
      wrap.append(item);
    });
    return wrap;
  }

  // --- الاقتراحات: بطاقات + صفحة تفصيل + سلسلة ردود ---
  function statusPill(status, founderMode) {
    const decided = !founderMode && ["accepted", "rejected", "done"].includes(status);
    return el("span", { class: decided ? "badge founder" : "badge alt" },
      (decided ? "قرار المؤسس: " : "") + (STATUS_LABEL[status] || status));
  }

  function suggestionCard(s, founderMode, onOpen) {
    const prev = (s.body.length > 110 ? s.body.slice(0, 110) + "…" : s.body).replace(/\s+/g, " ");
    const highlight = founderMode ? s.status === "new" : s.unread;
    const card = el("button", { class: "scard" + (highlight ? " is-new" : ""), type: "button" },
      el("div", { class: "meta" },
        s.unread ? el("span", { class: "badge founder" }, "جديد من المؤسس") : null,
        el("span", { class: "badge" }, CAT_LABEL[s.category] || s.category),
        statusPill(s.status, founderMode),
        el("span", { class: "muted" }, fmtDate(s.created_at)),
        s.reply_count ? el("span", { class: "muted" }, s.reply_count + " رد") : null),
      el("strong", { class: "stitle" }, s.title),
      el("span", { class: "muted sprev" }, prev),
      founderMode && s.author_name ? el("span", { class: "muted" }, "من: " + s.author_name) : null);
    card.addEventListener("click", () => onOpen(s));
    return card;
  }

  function suggestionDetail(s, founderMode, goBack) {
    const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع إلى القائمة");
    back.addEventListener("click", goBack);
    const statusBadge = statusPill(s.status, founderMode);
    const wrap = el("div", null,
      back,
      el("div", { class: "meta" },
        el("span", { class: "badge" }, CAT_LABEL[s.category] || s.category),
        statusBadge,
        el("span", { class: "muted" }, fmtDate(s.created_at) + (founderMode && s.author_name ? " — " + s.author_name : ""))),
      el("h2", { style: "margin-top:14px" }, s.title),
      el("div", { class: "readbox" }, s.body));

    const thread = el("div");
    async function loadThread() {
      const { data, error } = await db.rpc("list_suggestion_replies", { p_id: s.id });
      if (error) { thread.replaceChildren(el("p", { class: "msg error" }, "تعذّر تحميل الردود.")); return; }
      const kids = [];
      if (data.length) kids.push(el("h3", null, "ردود المؤسس"));
      data.forEach((r) => kids.push(el("div", { class: "replybox" },
        el("div", null, crownEl(), el("strong", null, "المؤسس"), el("span", { class: "muted" }, " · " + fmtDate(r.created_at))),
        el("p", null, r.body))));
      if (!data.length && !founderMode) kids.push(el("p", { class: "muted" }, "لم يصل رد بعد."));
      thread.replaceChildren(...kids);
    }
    wrap.append(thread);

    if (founderMode) {
      const st = el("select", null, ...Object.entries(STATUS_LABEL).map(([k, v]) => el("option", { value: k }, v)));
      st.value = s.status;
      const stBtn = el("button", { class: "btn small", type: "button" }, "حفظ الحالة");
      stBtn.addEventListener("click", async () => {
        stBtn.disabled = true;
        const { error: e } = await db.rpc("set_suggestion_status", { p_id: s.id, p_status: st.value });
        stBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        s.status = st.value;
        statusBadge.textContent = STATUS_LABEL[s.status];
        notify("تم حفظ الحالة.", "ok");
      });
      const rp = el("textarea", { placeholder: "اكتب رداً يصل إلى صاحب الاقتراح", maxlength: "2000" });
      const rpBtn = el("button", { class: "btn small", type: "button" }, "إرسال الرد");
      rpBtn.addEventListener("click", async () => {
        const text = rp.value.trim();
        if (!text) return notify("اكتب الرد أولاً.", "error");
        rpBtn.disabled = true;
        const { error: e } = await db.rpc("reply_suggestion", { p_id: s.id, p_body: text });
        rpBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        rp.value = "";
        await loadThread();
        notify("أُرسل ردّك. سيظهر لصاحب الاقتراح فور دخوله.", "ok");
      });
      wrap.append(
        el("label", null, "الحالة"), el("div", { class: "row" }, st, stBtn),
        el("label", null, "رد جديد"), rp, el("div", { class: "actions" }, rpBtn));
    }

    loadThread().then(async () => {
      if (!founderMode && s.unread) {
        await db.rpc("mark_suggestion_seen", { p_id: s.id });
        s.unread = false;
        refreshBadges();
      }
    });
    return wrap;
  }

  async function founderSuggestionsTab() {
    const box = el("div");
    async function list() {
      box.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      const { data, error } = await db.rpc("list_suggestions");
      if (error) { box.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة.")); return; }
      if (!data.length) { box.replaceChildren(el("p", { class: "muted" }, "لا توجد اقتراحات بعد.")); return; }
      const fresh = data.filter((x) => x.status === "new").length;
      box.replaceChildren(
        el("p", { class: "muted" }, data.length + " اقتراح · " + fresh + " جديد"),
        el("div", { class: "cards" }, ...data.map((x) => suggestionCard(x, true, open))));
    }
    function open(s) { notify(""); box.replaceChildren(suggestionDetail(s, true, list)); }
    await list();
    return box;
  }

  async function mySuggestionsTab() {
    const box = el("div");
    async function list() {
      box.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      const { data, error } = await db.rpc("list_suggestions");
      if (error) { box.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة.")); return; }
      const newBtn = el("button", { class: "btn small", type: "button" }, "+ اقتراح جديد");
      newBtn.addEventListener("click", form);
      box.replaceChildren(
        el("div", { class: "topbar" }, el("h2", { style: "margin:0" }, "اقتراحاتي"), newBtn),
        data.length
          ? el("div", { class: "cards" }, ...data.map((x) => suggestionCard(x, false, open)))
          : el("p", { class: "muted" }, "لم ترسل اقتراحات بعد. اضغط «اقتراح جديد» لتبدأ."));
    }
    function open(s) { notify(""); box.replaceChildren(suggestionDetail(s, false, list)); }
    function form() {
      notify("");
      const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع إلى القائمة");
      back.addEventListener("click", list);
      const cat = el("select", null, ...Object.entries(CAT_LABEL).map(([k, v]) => el("option", { value: k }, v)));
      const title = el("input", { type: "text", maxlength: "120", placeholder: "عنوان الاقتراح" });
      const body = el("textarea", { maxlength: "4000", placeholder: "اشرح اقتراحك، وكيف يفيد الطلاب أو سير العمل في المنصة" });
      const btn = el("button", { class: "btn", type: "button" }, "إرسال الاقتراح");
      btn.addEventListener("click", async () => {
        if (title.value.trim().length < 3 || body.value.trim().length < 10) {
          return notify("اكتب عنواناً واضحاً وشرحاً لا يقل عن 10 أحرف.", "error");
        }
        btn.disabled = true;
        const { error: e } = await db.rpc("submit_suggestion", {
          p_category: cat.value, p_title: title.value, p_body: body.value
        });
        btn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        await list();
        notify("وصل اقتراحك إلى المؤسس. شكراً لك.", "ok");
      });
      box.replaceChildren(back, el("h2", { style: "margin-top:8px" }, "اقتراح جديد"),
        el("label", null, "النوع"), cat,
        el("label", null, "العنوان"), title,
        el("label", null, "التفاصيل"), body,
        btn);
    }
    await list();
    return box;
  }

  async function founderBriefing() {
    const out = { total: null, pending: null, fresh: null, newToday: null, vacant: null };
    try {
      const [acc, req, sug, lim] = await Promise.all([
        db.rpc("founder_list_accounts"), db.rpc("founder_list_requests"), db.rpc("list_suggestions"),
        db.from("platform_limits").select("key,value")
      ]);
      if (acc.data) {
        out.total = acc.data.length;
        out.newToday = acc.data.filter((a) => Date.now() - new Date(a.created_at).getTime() < 864e5).length;
        if (lim.data) {
          const L = Object.fromEntries(lim.data.map((l) => [l.key, l.value]));
          const cnt = (r) => acc.data.filter((a) => a.role === r).length;
          out.vacant = ["chief", "technical", "assistant"]
            .reduce((sum, r) => sum + Math.max(0, (L["max_" + r] || 0) - cnt(r)), 0);
        }
      }
      if (req.data) out.pending = req.data.filter((r) => r.status === "pending").length;
      if (sug.data) out.fresh = sug.data.filter((x) => x.status === "new").length;
    } catch (e) { /* show dashes */ }
    return out;
  }

  function founderBanner(b) {
    const stat = (n, label, hot) =>
      el("div", { class: "stat" + (hot && n > 0 ? " hot" : "") }, el("b", null, n === null ? "—" : n), el("span", null, label));
    return [
      crownEl(),
      el("h2", null, timeGreeting() + "، أهلاً بمؤسس لمّة"),
      el("p", { class: "muted", style: "margin:0" }, "المنصة كلها بين يديك."),
      el("div", { class: "stats" },
        stat(b.fresh, "اقتراحات جديدة", true),
        stat(b.pending, "طلبات بانتظار قرارك", true),
        stat(b.newToday, "حسابات جديدة اليوم", true),
        stat(b.total, "إجمالي الحسابات", false),
        stat(b.vacant, "مناصب شاغرة", false))
    ];
  }

  function supervisorNotice(n) {
    if (!n) return [];
    return [
      crownEl(),
      el("h2", null, "رد جديد من المؤسس"),
      el("p", { class: "muted", style: "margin:0" },
        n === 1 ? "لديك اقتراح واحد عليه رد أو قرار جديد." : "لديك " + n + " اقتراحات عليها ردود أو قرارات جديدة.")
    ];
  }

  // Shown only on this device, once per login. Nothing is announced to anyone else.
  function showGate() {
    try { if (sessionStorage.getItem("gateShown")) return; sessionStorage.setItem("gateShown", "1"); } catch (e) { /* ignore */ }
    const gate = el("div", { class: "gate", role: "presentation" },
      crownEl(), el("h2", null, "أهلاً بمؤسس لمّة"), el("p", null, "المنصة في خدمتك"));
    const close = () => {
      if (!gate.isConnected) return;
      gate.classList.add("out");
      setTimeout(() => gate.remove(), 600);
    };
    gate.addEventListener("click", close);
    document.body.append(gate);
    setTimeout(close, 2300);
  }

  async function renderApp(session) {
    show("appView");
    const user = session.user;
    let name = (user.user_metadata && user.user_metadata.full_name) || "";
    let role = "student";
    try {
      const r = await db.rpc("current_role_name");
      if (!r.error && r.data) role = r.data;
      const p = await db.from("profiles").select("full_name").eq("id", user.id).maybeSingle();
      if (p.data && p.data.full_name) name = p.data.full_name;
    } catch (e) { /* keep defaults */ }
    const first = (name || "").trim().split(/\s+/)[0];
    $("welcomeName").textContent = first ? "أهلاً " + first : "أهلاً بك";
    $("roleBadge").textContent = ROLE_LABEL[role] || ROLE_LABEL.student;
    $("roleBadge").className = "badge" + (role === "founder" ? " founder" : "");
    document.body.classList.toggle("founder", role === "founder");
    currentRole = role;
    $("banner").replaceChildren();
    notify("");

    if (role === "founder") {
      const b = await founderBriefing();
      $("banner").replaceChildren(...founderBanner(b));
      showGate();
      buildTabs([
        { label: "الحسابات", render: accountsTab },
        { label: "الحدود", render: limitsTab },
        { label: "طلبات التعيين" + (b.pending ? " (" + b.pending + ")" : ""), render: requestsTab },
        { label: "الاقتراحات" + (b.fresh ? " (" + b.fresh + ")" : ""), render: founderSuggestionsTab }
      ]);
    } else if (["chief", "technical", "assistant"].includes(role)) {
      const sug = await db.rpc("list_suggestions");
      const n = sug.data ? sug.data.filter((x) => x.unread).length : 0;
      $("banner").replaceChildren(...supervisorNotice(n));
      buildTabs([{ label: "اقتراحاتي" + (n ? " (" + n + ")" : ""), render: mySuggestionsTab }]);
    } else {
      $("tabBar").replaceChildren();
      $("tabBody").replaceChildren(el("p", null, "حسابك جاهز. المواد والدروس قريباً بإذن الله."));
    }
  }

  // تحديث الأعداد والإشعارات كل دقيقة أثناء وجود المستخدم في الصفحة
  async function refreshBadges() {
    if (document.visibilityState !== "visible" || !currentRole) return;
    try {
      if (currentRole === "founder") {
        const b = await founderBriefing();
        $("banner").replaceChildren(...founderBanner(b));
        setTabLabel(2, "طلبات التعيين" + (b.pending ? " (" + b.pending + ")" : ""));
        setTabLabel(3, "الاقتراحات" + (b.fresh ? " (" + b.fresh + ")" : ""));
      } else if (["chief", "technical", "assistant"].includes(currentRole)) {
        const sug = await db.rpc("list_suggestions");
        const n = sug.data ? sug.data.filter((x) => x.unread).length : 0;
        $("banner").replaceChildren(...supervisorNotice(n));
        setTabLabel(0, "اقتراحاتي" + (n ? " (" + n + ")" : ""));
      }
    } catch (e) { /* try again next minute */ }
  }
  setInterval(refreshBadges, 60000);
  document.addEventListener("visibilitychange", refreshBadges);

  $("logoutBtn").addEventListener("click", async () => {
    try { sessionStorage.removeItem("gateShown"); } catch (e) { /* ignore */ }
    await db.auth.signOut();
  });

  // ---------- توجيه الحالة ----------
  let shownUser = null;
  function route(session) {
    if (recoveryMode) { show("recoveryView"); return; }
    if (session && session.user) {
      if (shownUser === session.user.id && !$("appView").hidden) return;
      shownUser = session.user.id;
      renderApp(session);
    } else {
      shownUser = null;
      $("tabBody").replaceChildren();
      $("banner").replaceChildren();
      document.body.classList.remove("founder");
      currentRole = null;
      tabDefs = [];
      show("authView");
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") { recoveryMode = true; setTimeout(() => show("recoveryView"), 0); return; }
    if (event === "TOKEN_REFRESHED") return;
    setTimeout(() => route(session), 0);
  });

  if (hashErrorCode) {
    showMsg(hashErrorCode === "otp_expired"
      ? "انتهت صلاحية الرابط أو سبق استخدامه. سجّل الدخول، وإن لم يُؤكَّد بريدك فاطلب إعادة الإرسال."
      : "تعذّر إكمال الرابط. حاول مرة أخرى.", "error");
    $("resendBtn").hidden = false;
  }
</script>
</body>
</html>
