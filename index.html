<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لمّة</title>
<style>
  :root {
    --bg: #f3f1ea;
    --card: #fbfaf6;
    --ink: #2a3a33;
    --muted: #6b7a72;
    --green: #3f7d5c;
    --green-ink: #ffffff;
    --red: #b5483c;
    --line: #d9d5c8;
    --panel: #ebe8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17201b;
      --card: #1d2922;
      --ink: #e8eee9;
      --muted: #9fb0a6;
      --green: #6fbf93;
      --green-ink: #10281c;
      --red: #e0806f;
      --line: #33443a;
      --panel: #202c25;
    }
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif;
    display: grid;
    place-items: start center;
    padding: 24px 16px 48px;
  }
  main { width: 100%; max-width: 400px; text-align: center; }
  main.wide { max-width: 760px; }
  h1 {
    font-size: clamp(3rem, 12vw, 4.4rem);
    margin: 8px 0 4px;
    color: var(--green);
    font-weight: 700;
    line-height: 1.2;
  }
  .tagline { margin: 0 0 24px; color: var(--muted); font-size: 1.05rem; }
  h2 { margin: 0 0 12px; font-size: 1.25rem; }
  h3 { margin: 8px 0 0; font-size: 1.02rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    text-align: right;
  }
  .card + .card, .card + div { margin-top: 14px; }
  .inner { margin-bottom: 18px; }
  .tabs, .tabbar {
    background: var(--panel);
    padding: 5px;
    border-radius: 12px;
  }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 20px; }
  .tabbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  .tabbar .tab { flex: 1 1 auto; }
  .tab {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--card); color: var(--ink); font-weight: 600; }
  label { display: block; font-size: .9rem; margin: 14px 0 6px; }
  input, select, textarea {
    font: inherit;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="text"], input[type="email"], input[type="password"], textarea { width: 100%; }
  textarea { min-height: 110px; resize: vertical; margin-top: 8px; }
  input[type="email"], input[type="password"] { direction: ltr; text-align: left; }
  input.num { width: 90px; text-align: center; padding: 8px; }
  select { padding: 9px 10px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible,
  .tab:focus-visible, .btn:focus-visible, .linkbtn:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 2px;
  }
  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: 0;
    border-radius: 10px;
    background: var(--green);
    color: var(--green-ink);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .btn.small { width: auto; margin-top: 0; padding: 8px 16px; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost-red { background: transparent; color: var(--red); border: 1px solid var(--red); }
  .linkbtn {
    background: none; border: 0; color: var(--green); font: inherit;
    cursor: pointer; padding: 8px 0; text-decoration: underline;
  }
  .msg { min-height: 1.4em; margin: 14px 0 0; font-size: .92rem; }
  .msg.error { color: var(--red); }
  .msg.ok { color: var(--green); }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 6px; }
  .detail {
    display: block; direction: ltr; text-align: left; color: var(--muted);
    font-size: .75rem; margin-top: 6px; word-break: break-word;
  }
  .muted { color: var(--muted); font-size: .85rem; }
  .ltr { direction: ltr; text-align: left; }

  .welcome { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .welcome h2 { margin: 0; }
  .welcome .grow { flex: 1 1 200px; }
  .badge {
    display: inline-block; padding: 3px 12px; border-radius: 999px;
    background: var(--panel); color: var(--ink); font-size: .8rem;
  }
  .badge.alt { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .row {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .grow { flex: 1 1 200px; min-width: 0; }
  .item { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item p { white-space: pre-wrap; margin: 8px 0; }
  .item .reply { color: var(--green); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cards { display: grid; gap: 10px; }
  .scard {
    display: flex; flex-direction: column; gap: 6px; align-items: stretch;
    text-align: right; width: 100%; padding: 14px 16px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .scard:hover { border-color: var(--green); }
  .scard:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  .scard.is-new { border-inline-start: 4px solid var(--green); }
  .stitle { font-size: 1.02rem; }
  .sprev { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .readbox {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; line-height: 1.9; white-space: pre-wrap; font-size: 1.02rem; margin: 12px 0;
  }
  .replybox { border-inline-start: 4px solid var(--green); background: var(--panel); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
  .replybox p { white-space: pre-wrap; margin: 6px 0 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .actions { margin-top: 14px; }
  :root { --gold: #a97a1f; --gold-soft: rgba(169,122,31,.12); }
  @media (prefers-color-scheme: dark) { :root { --gold: #e3b95c; --gold-soft: rgba(227,185,92,.14); } }
  .badge.founder { background: var(--gold-soft); color: var(--gold); border: 1px solid var(--gold); font-weight: 600; }
  body.founder .welcome { border-color: var(--gold); }
  .banner {
    border: 1px solid var(--gold); border-radius: 16px; padding: 22px; text-align: right; margin-top: 14px;
    background: linear-gradient(135deg, var(--gold-soft), transparent 70%), var(--card);
    animation: rise .5s ease both;
  }
  .banner:empty { display: none; }
  .crown { display: inline-block; width: 30px; height: 30px; color: var(--gold); }
  .crown svg { width: 100%; height: 100%; display: block; }
  .banner h2 { color: var(--gold); margin: 6px 0 4px; font-size: 1.35rem; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .stat { background: var(--panel); border-radius: 12px; padding: 10px 16px; min-width: 120px; }
  .stat b { display: block; font-size: 1.5rem; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .stat.hot b { color: var(--gold); }
  .tag {
    display: inline-block; direction: ltr; font-size: .68rem; letter-spacing: .04em; line-height: 1.5;
    padding: 0 6px; margin-inline-start: 6px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
    vertical-align: 1px;
  }
  .tag.fnd { border-color: var(--gold); color: var(--gold); }
  .badge.ok { background: transparent; border: 1px solid var(--green); color: var(--green); }
  .results { display: grid; gap: 6px; margin-top: 8px; }
  .pick {
    display: block; width: 100%; text-align: right; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font: inherit; cursor: pointer;
  }
  .pick:hover { border-color: var(--green); }
  .chosen { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
  .panel { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 6px; }
  .pname { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 4px; }
  .pop {
    position: absolute; z-index: 40; width: min(270px, calc(100vw - 16px)); text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
  }
  .pop-ar { font-size: 1.08rem; font-weight: 700; }
  .pop-ar.fnd { color: var(--gold); }
  .pop-en { direction: ltr; color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .pop-name { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .pop-elite { margin-top: 8px; color: var(--gold); font-size: .85rem; }
  details { border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; margin: 10px 0; background: var(--card); }
  details > details { background: var(--bg); }
  summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  details[open] > summary { margin-bottom: 6px; }
  .video { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; margin: 12px 0; }
  body.calm .tabbar { display: none; }
  body.calm .banner { border: 0; padding: 0; background: none; animation: none; margin-top: 14px; }
  .hero { position: relative; height: clamp(230px, 38vh, 340px); border-radius: 18px; overflow: hidden; background: #1b2530; }
  .hero-art, .hero-art svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero-text { position: absolute; inset-inline: 0; bottom: 0; padding: 22px; color: #fff; text-align: right;
    background: linear-gradient(to top, rgba(0,0,0,.5), transparent); }
  .hero-text h2 { color: #fff; margin: 6px 0 2px; font-size: 1.45rem; text-shadow: 0 1px 8px rgba(0,0,0,.45); }
  .hero-text p { margin: 0; color: rgba(255,255,255,.88); }
  .hero-text .crown { width: 26px; height: 26px; color: #f1d38a; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; min-height: 32px; }
  .chip { background: var(--panel); border-radius: 999px; padding: 6px 14px; font-size: .85rem; color: var(--muted); }
  .chip.hot { color: var(--gold); border: 1px solid var(--gold); background: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { padding: 20px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); font: inherit; cursor: pointer; }
  .tile:hover, .tile:focus-visible { border-color: var(--gold); outline: none; }
  .sectionbar { display: flex; align-items: center; gap: 14px; margin: 14px 0 8px; }
  .hero {
    position: relative; border-radius: 18px; overflow: hidden; min-height: 240px; color: #fff;
    display: flex; align-items: flex-end; background: #2b2b52;
  }
  .scene { position: absolute; inset: 0; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .hero-text { position: relative; width: 100%; padding: 22px; background: linear-gradient(to top, rgba(0,0,0,.5), transparent); }
  .hero h2 { color: #fff; margin: 0 0 4px; font-size: 1.6rem; }
  .hero p { margin: 0; opacity: .92; }
  .hero .linkbtn { color: #fff; opacity: .85; padding: 8px 0 0; }
  .doors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .door {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: right;
    padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
    color: var(--ink); font: inherit; cursor: pointer;
  }
  .door:hover { border-color: var(--green); }
  .pop-dept { color: var(--muted); font-size: .85rem; margin-top: 6px; }
  .gate {
    position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; text-align: center;
    background: #0f1613; color: #f3e7c6; cursor: pointer; animation: gatein .4s ease both;
  }
  .gate .crown { width: 76px; height: 76px; color: #e3b95c; margin: 0 auto; }
  .gate h2 { font-size: clamp(1.7rem, 6vw, 2.5rem); margin: 16px 0 6px; color: #f3e7c6; }
  .gate p { margin: 0; color: #c9b98a; }
  .gate.out { animation: gateout .6s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes gatein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gateout { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { .banner, .gate, .gate.out { animation: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main id="main">
  <h1>لمّة</h1>
  <p class="tagline">منصة تعليمية سودانية — قريباً</p>

  <!-- تسجيل الدخول وإنشاء حساب -->
  <section class="card" id="authView">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" type="button">تسجيل الدخول</button>
      <button class="tab" role="tab" id="tabSignup" aria-selected="false" type="button">إنشاء حساب</button>
    </div>

    <div id="nameRow" hidden>
      <label for="fullName">الاسم الكامل</label>
      <input id="fullName" type="text" autocomplete="name">
    </div>

    <label for="email">البريد الإلكتروني</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">

    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="hint" id="pwHint" hidden>8 أحرف على الأقل</div>

    <button class="btn" id="submitBtn" type="button">دخول</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <small class="detail" id="detail"></small>
    <button class="linkbtn" id="resendBtn" type="button" hidden>إعادة إرسال رسالة التأكيد</button>
    <div><button class="linkbtn" id="forgotLink" type="button">نسيت كلمة المرور؟</button></div>
  </section>

  <!-- استعادة كلمة المرور -->
  <section class="card" id="forgotView" hidden>
    <h2>استعادة كلمة المرور</h2>
    <label for="fEmail">البريد الإلكتروني</label>
    <input id="fEmail" type="email" autocomplete="email" inputmode="email">
    <button class="btn" id="fSend" type="button">إرسال رابط الاستعادة</button>
    <p class="msg" id="fMsg" role="status" aria-live="polite"></p>
    <button class="linkbtn" id="fBack" type="button">العودة إلى تسجيل الدخول</button>
  </section>

  <!-- كلمة مرور جديدة -->
  <section class="card" id="recoveryView" hidden>
    <h2>كلمة مرور جديدة</h2>
    <label for="rPass">كلمة المرور الجديدة</label>
    <input id="rPass" type="password" autocomplete="new-password">
    <label for="rPass2">أعد كتابتها</label>
    <input id="rPass2" type="password" autocomplete="new-password">
    <div class="hint">8 أحرف على الأقل</div>
    <button class="btn" id="rSave" type="button">حفظ</button>
    <p class="msg" id="rMsg" role="status" aria-live="polite"></p>
  </section>

  <!-- بعد الدخول -->
  <section id="appView" hidden>
    <div class="card welcome">
      <div class="grow">
        <h2 id="welcomeName"></h2>
        <span class="badge" id="roleBadge"></span>
      </div>
      <button class="btn secondary small" id="logoutBtn" type="button">تسجيل الخروج</button>
    </div>
    <div class="banner" id="banner"></div>
    <div class="tabbar" id="tabBar" role="tablist"></div>
    <p class="msg" id="panelMsg" role="status" aria-live="polite"></p>
    <div class="sectionbar" id="sectionBar" hidden>
      <button class="linkbtn" id="homeBtn" type="button">→ الرئيسية</button>
      <strong id="sectionTitle"></strong>
    </div>
    <div class="card" id="tabBody"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Public values only. Never put a secret key (sb_secret_ or service_role) here.
  const SUPABASE_URL = "https://abdnfozkxoexcivplhcr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PI3MB7MGuXuuXIXBEFI7ew_3MSZgiHd";

  // Read link errors / recovery flag BEFORE the client touches the URL.
  let recoveryMode = location.hash.includes("type=recovery");
  const hashErrorCode = (function () {
    if (!location.hash || location.hash.length < 2) return null;
    const p = new URLSearchParams(location.hash.slice(1));
    if (!p.get("error") && !p.get("error_code")) return null;

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (k === "class") e.className = v;
        else e.setAttribute(k, v);
      }
    }
    for (const kid of kids.flat()) {

  const showMsg = (t, type) => setMsg("msg", t, type);

  function show(id) {
    ["authView", "forgotView", "recoveryView", "appView"].forEach((v) => { $(v).hidden = v !== id; });
    $("main").classList.toggle("wide", id === "appView");
  }
  function fmtDate(d) { return new Date(d).toLocaleDateString("ar-EG"); }

  // Static, trusted SVG (no user content).
  const CROWN_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>';
  function crownEl() {
    const c = document.createElement("span");
    c.className = "crown";
    c.innerHTML = CROWN_SVG;
    return c;
  }
  function timeGreeting() {
    const h = new Date().getHours();
    if (h >= 5 && h < 12) return "صباح الخير";
    if (h >= 12 && h < 18) return "طاب يومك";
    return "مساء الخير";
  }

  const ROLE_LABEL = {

    assistant: "مشرف مساعد", student: "طالب"
  };
  const CAT_LABEL = {
    lessons: "المواد والدروس", teaching: "طريقة التدريس", student_experience: "تجربة الطالب",
    technical: "الجانب التقني", supervisors: "بيئة عمل المشرفين", other: "أخرى"
  };
  const STATUS_LABEL = {
    new: "جديد", reviewing: "قيد الدراسة", accepted: "مقبول", rejected: "مرفوض", done: "نُفِّذ"
  };
  const REQ_STATUS = { pending: "بانتظار قرارك", approved: "مقبول", rejected: "مرفوض" };

  function friendlyError(err) {
    const m = ((err && err.message) || "").toLowerCase();
    if (m.includes("invalid login")) return "البريد أو كلمة المرور غير صحيحة.";
    if (m.includes("email not confirmed")) return "لم يتم تأكيد بريدك بعد. افتح رسالة التأكيد، أو اطلب إعادة إرسالها.";
    if (m.includes("already registered")) return "هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.";
    if (m.includes("security purposes") || m.includes("rate limit") || m.includes("too many")) return "انتظر دقيقة ثم أعد المحاولة.";
    if (m.includes("password")) return "كلمة المرور ضعيفة. استخدم 8 أحرف على الأقل.";
    if (m.includes("expired") || m.includes("invalid")) return "انتهت صلاحية الرابط أو سبق استخدامه.";
    if (m.includes("fetch") || m.includes("network")) return "تعذّر الاتصال بالخادم. تحقق من الإنترنت.";
    return "حدث خطأ. أعد المحاولة بعد قليل.";
  }
  function rpcError(err) {
    const m = (err && err.message) || "";
    const map = {
      GLOBAL_LIMIT: "وصلت المنصة إلى الحد الأقصى لهذا المنصب.",
      PERSONAL_LIMIT: "وصلت إلى الحد المسموح لك من التعيينات.",
      NOT_ALLOWED: "ليس لديك صلاحية لهذا الإجراء.",
      TARGET_NOT_STUDENT: "يمكن تعيين الطلاب فقط.",
      TARGET_NOT_FOUND: "الحساب غير موجود.",

  // ---------- تسجيل الدخول ----------
  let mode = "login";
  function setMode(next) {
    mode = next;
    const signup = mode === "signup";
    $("tabLogin").setAttribute("aria-selected", String(!signup));
    $("tabSignup").setAttribute("aria-selected", String(signup));
    $("nameRow").hidden = !signup;
    $("pwHint").hidden = !signup;
    $("password").autocomplete = signup ? "new-password" : "current-password";
    $("submitBtn").textContent = signup ? "إنشاء الحساب" : "دخول";
    $("resendBtn").hidden = true;
    $("detail").textContent = "";
    showMsg("");
  }

  async function submit() {
    const email = $("email").value.trim();
    const password = $("password").value;
    const fullName = $("fullName").value.trim();

    if (!email || !password) return showMsg("أدخل البريد وكلمة المرور.", "error");
    if (mode === "signup") {
      if (!fullName) return showMsg("أدخل اسمك الكامل.", "error");
      if (password.length < 8) return showMsg("كلمة المرور يجب ألا تقل عن 8 أحرف.", "error");
    }

    const btn = $("submitBtn");
    btn.disabled = true;
    showMsg("جاري المعالجة…");
    $("detail").textContent = "";
    $("resendBtn").hidden = true;
    try {
      if (mode === "signup") {
        const { data, error } = await db.auth.signUp({
          email, password,
          options: { data: { full_name: fullName }, emailRedirectTo: location.origin }
        });
        if (error) throw error;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          return showMsg("هذا البريد مسجّل مسبقاً. جرّب تسجيل الدخول.", "error");
        }
        if (!data.session) {
          showMsg("تم إنشاء الحساب. افتح بريدك واضغط رابط التأكيد خلال ساعة، ثم سجّل الدخول.", "ok");
          $("resendBtn").hidden = false;
        }
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (e) {
      showMsg(friendlyError(e), "error");
      $("detail").textContent = (e && e.message) ? e.message : "";
      if (((e && e.message) || "").toLowerCase().includes("not confirmed")) $("resendBtn").hidden = false;
    } finally {
      btn.disabled = false;
    }
  }

  $("tabLogin").addEventListener("click", () => setMode("login"));
  $("tabSignup").addEventListener("click", () => setMode("signup"));
  $("submitBtn").addEventListener("click", submit);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });

  function buildTabs(defs, auto = true) {
    const bar = $("tabBar"), body = $("tabBody");
    tabDefs = defs;
    bar.replaceChildren();
    let current = null;
    async function select(d) {
      current = d;
      defs.forEach((x) => x.btn.setAttribute("aria-selected", String(x === d)));
      notify("");
      body.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      try {
        body.replaceChildren(await d.render());
      } catch (e) {
        body.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة."));
      }
    }
    defs.forEach((d) => {
      d.btn = el("button", { class: "tab", role: "tab", type: "button", "aria-selected": "false" }, d.label);
      d.btn.addEventListener("click", () => select(d));
      bar.append(d.btn);
    });
    reloadTab = () => current && select(current);
    goTab = (i) => { if (defs[i]) select(defs[i]); };
    if (auto && defs.length) select(defs[0]);
    return select;
  }

  // --- الاقتراحات: توجيه واستلام وتحويل وحذف ---
  const LEVEL_LABEL = { assistant: "مشرف مساعد", technical: "مشرف فني", chief: "مشرف رئيسي", founder: "المؤسس" };
  const ROLE_TAG = { founder: "FND", chief: "SUP-C", technical: "SUP-T", assistant: "SUP-A" };
  const KEEP_LABEL = { 3: "3 أيام", 7: "أسبوع", 14: "أسبوعان", 30: "شهر" };

  const TITLES = {
    founder: ["المؤسس", "Founder"],
    chief: ["مشرف رئيسي", "Chief Supervisor"],
    technical: ["مشرف فني", "Technical Supervisor"],
    assistant: ["مشرف مساعد", "Assistant Supervisor"],
    student: ["طالب", "Student"]
  };
  let popEl = null;
  function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
  document.addEventListener("click", (e) => { if (popEl && !popEl.contains(e.target)) closePop(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePop(); });
  function placePop(pop, anchor) {
    const r = anchor.getBoundingClientRect();
    const w = pop.offsetWidth || 270;
    let left = window.scrollX + r.left + r.width / 2 - w / 2;
    left = Math.max(window.scrollX + 8, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 8));
    pop.style.left = left + "px";
    pop.style.top = (window.scrollY + r.bottom + 8) + "px";
  }
  // بطاقة تعريف صغيرة تظهر عند الضغط على اسم شخص (بدون صفحة جديدة)
  async function openCard(anchor, id) {
    closePop();
    const pop = el("div", { class: "pop", role: "dialog" }, el("p", { class: "muted", style: "margin:0" }, "جاري التحميل…"));
    document.body.append(pop);
    popEl = pop;
    placePop(pop, anchor);
    const { data, error } = await db.rpc("person_card", { p_id: id });
    if (popEl !== pop) return;
    if (error || !data || !data.length) { pop.replaceChildren(el("p", { class: "muted", style: "margin:0" }, "تعذّر عرض المعلومات.")); return; }
    const p = data[0];
    const special = p.role === "student" && p.can_suggest;
    const t = special ? ["طالب مميز", "Distinguished Student"] : (TITLES[p.role] || TITLES.student);
    pop.replaceChildren(
      el("div", { class: "pop-ar" + (p.role === "founder" ? " fnd" : "") }, t[0]),
      el("div", { class: "pop-en" }, t[1]),
      el("div", { class: "pop-name" }, p.full_name || "—"),
      p.department ? el("div", { class: "pop-dept" }, p.department) : null,
      p.elite ? el("div", { class: "pop-elite" }, "★ من نخبة المشرفين · Elite Supervisor") : null);
    placePop(pop, anchor);
  }

  // اسم + رمز الفئة؛ وإن مُرّر المعرّف يصبح قابلاً للضغط لعرض بطاقة التعريف
  function person(name, role, id) {
    const t = ROLE_TAG[role];
    const node = el("span", id ? { class: "pname", role: "button", tabindex: "0" } : null,
      name || "—", t ? el("span", { class: "tag" + (role === "founder" ? " fnd" : "") }, t) : null);
    if (id) {
      const open = (e) => { e.stopPropagation(); e.preventDefault(); openCard(node, id); };
      node.addEventListener("click", open);
      node.addEventListener("keydown", (e) => { if (e.key === "Enter") open(e); });
    }
    return node;
  }

  function personPicker(getLevel) {
    const input = el("input", { type: "text", placeholder: "اكتب أول حروف الاسم للبحث", autocomplete: "off" });
    const results = el("div", { class: "results" });
    const chosen = el("div", { class: "chosen" });
    let picked = null, timer = null;
    function setPicked(p) {
      picked = p;
      chosen.replaceChildren();
      if (p) {
        const x = el("button", { class: "linkbtn", type: "button" }, "إلغاء الاختيار");
        x.addEventListener("click", () => setPicked(null));
        chosen.append(el("span", { class: "badge" }, person(p.full_name, p.role)), x);
      }
      results.replaceChildren();
    }
    input.addEventListener("input", () => {
      clearTimeout(timer);
      const q = input.value.trim();
      if (!q) { results.replaceChildren(); return; }
      timer = setTimeout(async () => {
        const { data, error } = await db.rpc("search_supervisors", { p_level: getLevel() || null, p_query: q });
        if (error) { results.replaceChildren(el("p", { class: "muted" }, "تعذّر البحث.")); return; }
        if (!data.length) { results.replaceChildren(el("p", { class: "muted" }, "لا توجد نتائج.")); return; }
        results.replaceChildren(...data.map((p) => {
          const b = el("button", { class: "pick", type: "button" }, person(p.full_name, p.role));
          b.addEventListener("click", () => { input.value = ""; setPicked(p); });
          return b;
        }));
      }, 300);
    });
    return {
      node: el("div", null, input, results, chosen),
      get value() { return picked; },
      clear() { setPicked(null); input.value = ""; }
    };
  }

  // اختيار المستوى، أو مشرف بعينه بالبحث عن اسمه
  function targetChooser(levels) {
    const level = el("select", null, ...levels.map((k) => el("option", { value: k }, LEVEL_LABEL[k])));
    const picker = personPicker(() => (level.value === "founder" ? null : level.value));
    const pickWrap = el("div", null, picker.node);
    pickWrap.hidden = true;
    const toggle = el("button", { class: "linkbtn", type: "button" }, "اختيار مشرف بعينه");
    let specific = false;
    function setSpecific(v) {
      specific = v && level.value !== "founder";
      pickWrap.hidden = !specific;
      toggle.textContent = specific ? "إرساله لأي مشرف في هذا المستوى" : "اختيار مشرف بعينه";
      if (!specific) picker.clear();
    }
    toggle.addEventListener("click", () => setSpecific(!specific));
    level.addEventListener("change", () => { toggle.hidden = level.value === "founder"; setSpecific(false); });
    toggle.hidden = level.value === "founder";
    return {
      node: el("div", null, level, el("div", null, toggle), pickWrap),
      get level() { return level.value; },
      get user() { return picker.value ? picker.value.id : null; }
    };
  }

  function statusPill(status) {
    const done = ["accepted", "rejected", "done"].includes(status);
    return el("span", { class: done ? "badge ok" : "badge alt" }, STATUS_LABEL[status] || status);
  }

  function suggestionCard(s, kind, onOpen) {
    const prev = (s.body.length > 110 ? s.body.slice(0, 110) + "…" : s.body).replace(/\s+/g, " ");
    const highlight = kind === "mine" ? s.unread : (s.can_claim || s.offer_for_me || !!s.event_kind || (kind === "founder" && s.status === "new"));
    const card = el("button", { class: "scard" + (highlight ? " is-new" : ""), type: "button" },
      el("div", { class: "meta" },
        s.unread ? el("span", { class: "badge founder" }, "جديد") : null,
        s.offer_for_me ? el("span", { class: "badge founder" }, "عرض تحويل") : null,
        s.event_kind ? el("span", { class: "badge founder" }, s.event_kind === "reject" ? "رفض" : "اعتذار") : null,
        el("span", { class: "badge" }, CAT_LABEL[s.category] || s.category),
        statusPill(s.status),
        el("span", { class: "muted" }, fmtDate(s.created_at)),
        s.reply_count ? el("span", { class: "muted" }, s.reply_count + " رد") : null),
      el("strong", { class: "stitle" }, s.title),
      el("span", { class: "muted sprev" }, prev),
      kind !== "mine" ? el("span", { class: "muted" }, "من: ", person(s.author_name, s.author_role, s.author)) : null,
      s.handler
        ? el("span", { class: "muted" }, "المسؤول: ", person(s.handler_name, s.handler_role, s.handler))
        : el("span", { class: s.can_claim ? "badge founder" : "badge alt", style: "align-self:flex-start" }, "غير مستلم"),
      s.forwarded_by_name ? el("span", { class: "muted" }, "محوّل من: " + s.forwarded_by_name) : null);

  function suggestionDetail(s, goBack, reopen) {
    const isAuthor = s.author === myId;
    const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع إلى القائمة");
    back.addEventListener("click", goBack);
    const statusBadge = statusPill(s.status);
    const lines = el("div", { class: "muted", style: "margin-top:10px;line-height:1.9" });
    if (!isAuthor) lines.append(el("div", null, "من: ", person(s.author_name, s.author_role, s.author)));
    lines.append(el("div", null, "موجّه إلى: " + (LEVEL_LABEL[s.target_level] || "—")));
    lines.append(el("div", null, "المسؤول: ", s.handler ? person(s.handler_name, s.handler_role, s.handler) : "لم يُستلم بعد"));
    if (s.forwarded_by_name) lines.append(el("div", null, "محوّل من: " + s.forwarded_by_name));

    const wrap = el("div", null,
      back,
      el("div", { class: "meta" },
        el("span", { class: "badge" }, CAT_LABEL[s.category] || s.category),
        statusBadge,
        el("span", { class: "muted" }, fmtDate(s.created_at))),
      lines,
      el("h2", { style: "margin-top:14px" }, s.title),
      el("div", { class: "readbox" }, s.body));

    const thread = el("div");
    async function loadThread() {
      const { data, error } = await db.rpc("list_suggestion_replies", { p_id: s.id });
      if (error) { thread.replaceChildren(el("p", { class: "msg error" }, "تعذّر تحميل الردود.")); return; }
      s.reply_count = data.length;
      const kids = [];
      if (data.length) kids.push(el("h3", null, "الردود"));
      data.forEach((r) => kids.push(el("div", { class: "replybox" },
        el("div", null, el("strong", null, person(r.replier_name, r.replier_role, r.replier)),
          el("span", { class: "muted" }, " · " + fmtDate(r.created_at))),
        el("p", null, r.body))));
      if (!data.length && isAuthor) kids.push(el("p", { class: "muted" }, "لم يصل رد بعد."));
      thread.replaceChildren(...kids);
    }
    wrap.append(thread);

    // ردّ المستلم على تحويلٍ أرسلتَه (اعتذار أو رفض)
    if (s.event_kind) {
      const who = s.event_actor_name || "المستلم";
      wrap.append(el("div", { class: "replybox" },
        el("strong", null, s.event_kind === "reject" ? who + " رفض استلام هذا الاقتراح" : who + " اعتذر: لا يستطيع استلام هذا الاقتراح"),
        s.event_note ? el("p", null, s.event_note) : el("p", { class: "muted" }, "دون ملاحظة.")));
      db.rpc("mark_events_seen", { p_id: s.id }).then(() => { s.event_kind = null; refreshBadges(); });
    }

    // عرض تحويل بانتظار ردّي
    if (s.offer_for_me) {
      const note = el("textarea", { placeholder: "ملاحظة (اختيارية عند الاعتذار، وإلزامية عند الرفض)", maxlength: "1000" });
      const acc = el("button", { class: "btn", type: "button" }, "استلام الاقتراح");
      const cant = el("button", { class: "btn small secondary", type: "button" }, "لا يمكنني");
      const rej = el("button", { class: "btn small ghost-red", type: "button" }, "أرفض");
      const respond = (action) => async () => {
        const text = note.value.trim();
        if (action === "reject" && text.length < 3) return notify("اكتب سبب الرفض.", "error");
        [acc, cant, rej].forEach((b) => { b.disabled = true; });
        const { error: e } = await db.rpc("respond_offer", { p_id: s.id, p_action: action, p_note: text || null });
        [acc, cant, rej].forEach((b) => { b.disabled = false; });
        if (e) return notify(rpcError(e), "error");
        if (action === "accept") {
          s.handler = myId; s.handler_name = myName; s.handler_role = currentRole;
          s.is_mine = true; s.offer_for_me = false;
          reopen(s);
          notify("استلمتَ الاقتراح، وأصبحتَ مسؤولاً عنه.", "ok");
        } else {
          goBack();
          notify(action === "reject" ? "تم إرسال رفضك مع السبب." : "تم إرسال اعتذارك.", "ok");
        }
      };
      acc.addEventListener("click", respond("accept"));
      cant.addEventListener("click", respond("cannot"));
      rej.addEventListener("click", respond("reject"));
      wrap.append(el("div", { class: "panel" },
        el("h3", null, "عُرض عليك هذا الاقتراح" + (s.forwarded_by_name ? " من " + s.forwarded_by_name : "")),
        el("p", { class: "muted" }, "يمكنك استلامه، أو الاعتذار إن لم تستطع، أو الرفض مع ذكر السبب."),
        acc,
        el("label", null, "ملاحظة"), note,
        el("div", { class: "row", style: "border:0" }, cant, rej)));
    }

    if (s.can_claim) {
      const claim = el("button", { class: "btn", type: "button" }, "استلام هذا الاقتراح");
      claim.addEventListener("click", async () => {
        claim.disabled = true;
        const { error: e } = await db.rpc("claim_suggestion", { p_id: s.id });
        if (e) { claim.disabled = false; return notify(rpcError(e), "error"); }
        s.handler = myId; s.handler_name = myName; s.handler_role = currentRole;
        s.is_mine = true; s.can_claim = false;
        reopen(s);
        notify("استلمتَ الاقتراح، وأصبحتَ مسؤولاً عنه.", "ok");
      });
      wrap.append(claim);
    }

    if (s.is_mine) {
      // --- الرد ---
      const rp = el("textarea", { placeholder: "اكتب رداً يصل إلى صاحب الاقتراح", maxlength: "2000" });
      const rpBtn = el("button", { class: "btn small", type: "button" }, "إرسال الرد");
      rpBtn.addEventListener("click", async () => {
        const text = rp.value.trim();
        if (!text) return notify("اكتب الرد أولاً.", "error");
        rpBtn.disabled = true;
        const { error: e } = await db.rpc("reply_suggestion", { p_id: s.id, p_body: text });
        rpBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        rp.value = "";
        await loadThread();
        notify("أُرسل الرد. سيظهر لصاحب الاقتراح فور دخوله.", "ok");
      });

      // --- الحالة ---
      const st = el("select", null, ...Object.entries(STATUS_LABEL).map(([k, v]) => el("option", { value: k }, v)));
      st.value = s.status;
      const stBtn = el("button", { class: "btn small", type: "button" }, "حفظ الحالة");
      stBtn.addEventListener("click", async () => {
        stBtn.disabled = true;
        const { error: e } = await db.rpc("set_suggestion_status", { p_id: s.id, p_status: st.value });
        stBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        s.status = st.value;
        statusBadge.textContent = STATUS_LABEL[s.status];
        statusBadge.className = ["accepted", "rejected", "done"].includes(s.status) ? "badge ok" : "badge alt";
        notify("تم حفظ الحالة.", "ok");
      });

      // --- مدة الاحتفاظ ---
      const keep = el("select", null, ...Object.entries(KEEP_LABEL).map(([k, v]) => el("option", { value: k }, v)));
      keep.value = String(s.keep_days || 7);
      const keepBtn = el("button", { class: "btn small", type: "button" }, "حفظ المدة");
      keepBtn.addEventListener("click", async () => {
        keepBtn.disabled = true;
        const { error: e } = await db.rpc("set_suggestion_retention", { p_id: s.id, p_days: parseInt(keep.value, 10) });
        keepBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        s.keep_days = parseInt(keep.value, 10);
        notify("تم حفظ مدة الاحتفاظ.", "ok");
      });

      // --- التحويل ---
      const levels = currentRole === "founder" ? ["assistant", "technical", "chief"] : ["assistant", "technical", "chief", "founder"];
      const fc = targetChooser(levels);
      const showSel = currentRole === "founder"
        ? el("select", null,
            el("option", { value: "" }, "إظهار المصدر: حسب الإعداد الافتراضي"),
            el("option", { value: "show" }, "إظهار أنه محوّل مني"),
            el("option", { value: "hide" }, "إخفاء أنه محوّل مني"))
        : null;
      const modeSel = currentRole === "founder"
        ? el("select", null,
            el("option", { value: "optional" }, "طريقة التحويل: اقتراح تخييري (يستطيع الاعتذار أو الرفض)"),
            el("option", { value: "forced" }, "طريقة التحويل: فرض (يُسند إليه مباشرة)"))
        : null;
      const fwdBtn = el("button", { class: "btn small", type: "button" }, "تحويل");
      fwdBtn.addEventListener("click", async () => {
        fwdBtn.disabled = true;
        const { error: e } = await db.rpc("forward_suggestion", {
          p_id: s.id, p_level: fc.level, p_user: fc.user, p_show: showSel ? (showSel.value || null) : null,
          p_mode: modeSel ? modeSel.value : "optional"
        });
        fwdBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        goBack();
        notify("تم تحويل الاقتراح.", "ok");
      });

      // --- الحذف ---
      const delBtn = el("button", { class: "btn small ghost-red", type: "button" }, "حذف الاقتراح");
      delBtn.addEventListener("click", async () => {
        const answered = (s.reply_count || 0) > 0;
        const ask = answered
          ? "سيُحذف هذا الاقتراح نهائياً لدى الجميع. هل أنت متأكد؟"
          : "لم يُرَدّ على هذا الاقتراح بعد. هل أنت متأكد أنك تريد حذفه؟";
        if (!confirm(ask)) return;
        const { error: e } = await db.rpc("delete_suggestion", { p_id: s.id, p_force: !answered });
        if (e) return notify(rpcError(e), "error");
        goBack();
        notify("تم الحذف.", "ok");
      });

      wrap.append(
        el("div", { class: "panel" }, el("h3", null, "الرد"), rp, el("div", { class: "actions" }, rpBtn)),
        el("div", { class: "panel" }, el("h3", null, "الحالة"), el("div", { class: "row" }, st, stBtn)),
        el("div", { class: "panel" }, el("h3", null, "مدة الاحتفاظ بعد آخر رد"),
          el("div", { class: "row" }, keep, keepBtn),
          el("p", { class: "muted" }, s.delete_after ? "سيُحذف تلقائياً في " + fmtDate(s.delete_after) + " إن لم يصل رد جديد." : "يبدأ العدّ بعد أول رد.")),
        el("div", { class: "panel" }, el("h3", null, "تحويل الاقتراح"), fc.node, modeSel, showSel,
          el("div", { class: "actions" }, fwdBtn)),
        el("div", { class: "panel" }, delBtn));
    }

    loadThread().then(async () => {
      if (isAuthor && s.unread) {
        await db.rpc("mark_suggestion_seen", { p_id: s.id });
        s.unread = false;
        refreshBadges();
      }
    });
    return wrap;
  }

  // kind: founder | inbox | mine
  async function suggestionsTab(kind) {
    const box = el("div");
    let cache = [];
    let filter = "all";
    function open(s) { notify(""); box.replaceChildren(suggestionDetail(s, list, open)); }
    function renderList() {
      let items = cache;
      if (kind === "inbox") items = cache.filter((x) => x.author !== myId);
      if (kind === "mine") items = cache.filter((x) => x.author === myId);
      if (kind === "founder") {
        if (filter === "toMe") items = items.filter((x) => x.target_level === "founder");
        if (filter === "unclaimed") items = items.filter((x) => !x.handler);
      }
      let head;
      if (kind === "mine") {
        const newBtn = el("button", { class: "btn small", type: "button" }, "+ اقتراح جديد");
        newBtn.addEventListener("click", form);
        head = el("div", { class: "topbar" }, el("h2", { style: "margin:0" }, "اقتراحاتي"), newBtn);
      } else if (kind === "founder") {
        const sel = el("select", null,
          el("option", { value: "all" }, "كل الاقتراحات"),
          el("option", { value: "toMe" }, "الموجهة إلى المؤسس"),
          el("option", { value: "unclaimed" }, "غير المستلمة"));
        sel.value = filter;
        sel.addEventListener("change", () => { filter = sel.value; renderList(); });
        head = el("div", { class: "topbar" }, el("span", { class: "muted" }, items.length + " اقتراح"), sel);
      } else {
        head = el("p", { class: "muted" }, items.length + " اقتراح · " + items.filter((x) => x.can_claim || x.offer_for_me || x.event_kind).length + " بانتظار إجراء");
      }
      box.replaceChildren(head,
        items.length
          ? el("div", { class: "cards" }, ...items.map((x) => suggestionCard(x, kind, open)))
          : el("p", { class: "muted" }, kind === "mine" ? "لم ترسل اقتراحات بعد. اضغط «اقتراح جديد» لتبدأ." : "لا توجد اقتراحات."));
    }
    async function list() {
      box.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      const { data, error } = await db.rpc("list_suggestions");
      if (error) { box.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة.")); return; }
      cache = data;
      renderList();
    }
    function form() {
      notify("");
      const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع إلى القائمة");
      back.addEventListener("click", list);
      const cat = el("select", null, ...Object.entries(CAT_LABEL).map(([k, v]) => el("option", { value: k }, v)));
      const tc = targetChooser(["assistant", "technical", "chief", "founder"]);
      const title = el("input", { type: "text", maxlength: "120", placeholder: "عنوان الاقتراح" });
      const body = el("textarea", { maxlength: "4000", placeholder: "اشرح اقتراحك، وكيف يفيد الطلاب أو سير العمل في المنصة" });
      const btn = el("button", { class: "btn", type: "button" }, "إرسال الاقتراح");
      btn.addEventListener("click", async () => {
        if (title.value.trim().length < 3 || body.value.trim().length < 10) {
          return notify("اكتب عنواناً واضحاً وشرحاً لا يقل عن 10 أحرف.", "error");
        }
        btn.disabled = true;
        const { error: e } = await db.rpc("submit_suggestion", {
          p_category: cat.value, p_title: title.value, p_body: body.value,
          p_target_level: tc.level, p_target_user: tc.user
        });
        btn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        await list();
        notify("وصل اقتراحك. شكراً لك.", "ok");
      });
      box.replaceChildren(back, el("h2", { style: "margin-top:8px" }, "اقتراح جديد"),
        el("label", null, "النوع"), cat,
        el("label", null, "إلى"), tc.node,
        el("label", null, "العنوان"), title,
        el("label", null, "التفاصيل"), body,
        btn);
    }
    await list();
    return box;
  }

  // ---------- المواد والدروس ----------
  const TRACK_LABEL = { scientific: "علمي", literary: "أدبي" };
  const SUB_LABEL = { computer: "حاسوب", engineering: "هندسية", biology: "أحياء" };
  const LIT_LABEL = { geo_history: "الجغرافيا والتاريخ", english_lit: "اللغة الإنجليزية (أدب إنجليزي)", other: "أخرى" };

  function safeUrl(u) {
    try { const x = new URL(u); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; } catch (e) { return null; }
  }
  function youtubeId(u) {
    try {
      const x = new URL(u);
      let id = null;
      if (x.hostname === "youtu.be") id = x.pathname.slice(1);
      else if (x.hostname.endsWith("youtube.com")) id = x.searchParams.get("v") || (x.pathname.startsWith("/embed/") ? x.pathname.split("/")[2] : null);
      return id && /^[\w-]{6,20}$/.test(id) ? id : null;
    } catch (e) { return null; }
  }

  // نموذج بسيط: fields = [{key,label,type,value,options,hint}]
  function formView(title, fields, onSave, onCancel) {
    const inputs = {};
    const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع");
    back.addEventListener("click", onCancel);
    const kids = [back, el("h2", { style: "margin-top:8px" }, title)];
    fields.forEach((f) => {
      let input;
      if (f.type === "textarea") { input = el("textarea", { style: "min-height:200px" }); input.value = f.value || ""; }
      else if (f.type === "select") { input = el("select", null, ...f.options.map(([v, l]) => el("option", { value: v }, l))); input.value = f.value || ""; }
      else if (f.type === "check") { input = el("input", { type: "checkbox" }); input.checked = !!f.value; }
      else {
        input = el("input", { type: f.type || "text" });
        input.value = f.value === null || f.value === undefined ? "" : f.value;
        if (f.type === "url") input.style.direction = "ltr";
      }
      inputs[f.key] = input;
      kids.push(el("label", null, f.label), input);
      if (f.hint) kids.push(el("div", { class: "hint" }, f.hint));
    });
    const btn = el("button", { class: "btn", type: "button" }, "حفظ");
    btn.addEventListener("click", async () => {
      const vals = {};
      fields.forEach((f) => {
        const i = inputs[f.key];
        if (f.type === "check") vals[f.key] = i.checked;
        else if (f.type === "number") vals[f.key] = i.value === "" ? 0 : parseInt(i.value, 10);
        else vals[f.key] = i.value.trim();
      });
      btn.disabled = true;
      const err = await onSave(vals);
      btn.disabled = false;
      if (err) notify(rpcError(err), "error");
    });
    kids.push(btn);
    return el("div", null, ...kids);
  }

  function trackPicker() {
    const track = el("select", null,
      el("option", { value: "" }, "اختر السياق…"),
      el("option", { value: "scientific" }, "علمي"),
      el("option", { value: "literary" }, "أدبي"));
    const sub = el("select", null, el("option", { value: "" }, "اختر التخصص…"),
      ...Object.entries(SUB_LABEL).map(([k, v]) => el("option", { value: k }, v)));
    const lit = el("select", null, el("option", { value: "" }, "اختر مادتك الاختيارية…"),
      ...Object.entries(LIT_LABEL).map(([k, v]) => el("option", { value: k }, v)));
    const subWrap = el("div", null, el("label", null, "التخصص العلمي"), sub);
    const litWrap = el("div", null, el("label", null, "المادة الاختيارية"), lit);
    subWrap.hidden = true;
    litWrap.hidden = true;
    track.addEventListener("change", () => {
      subWrap.hidden = track.value !== "scientific";
      litWrap.hidden = track.value !== "literary";
    });
    const btn = el("button", { class: "btn", type: "button" }, "حفظ واختيار موادي");
    btn.addEventListener("click", async () => {
      if (!track.value) return notify("اختر السياق أولاً.", "error");
      if (track.value === "scientific" && !sub.value) return notify("اختر التخصص العلمي.", "error");
      if (track.value === "literary" && !lit.value) return notify("اختر مادتك الاختيارية.", "error");
      btn.disabled = true;
      const { error } = await db.rpc("set_my_track", {
        p_track: track.value,
        p_sub: track.value === "scientific" ? sub.value : null,
        p_lit: track.value === "literary" ? lit.value : null
      });
      btn.disabled = false;
      if (error) return notify(rpcError(error), "error");
      const { data } = await db.auth.getSession();
      if (data.session) { shownUser = null; route(data.session); }
    });
    return el("div", null,
      el("h2", null, "اختر مسارك الدراسي"),
      el("p", { class: "muted" }, "يظهر لك المحتوى المناسب لمسارك. ولا يمكن تغييره لاحقاً إلا عن طريق الإدارة."),
      el("label", null, "السياق"), track, subWrap, litWrap, btn);
  }

  async function contentTab() {
    const box = el("div");
    const canEdit = !!myPerms.edit_content;
    const canDelete = !!myPerms.delete_content;
    const isStaff = ["founder", "chief", "technical", "assistant"].includes(currentRole);
    const openIds = new Set();
    let tree = [];

    const swap = (node) => { notify(""); box.replaceChildren(node); };
    function mini(label, fn, danger) {
      const b = el("button", { class: "btn small " + (danger ? "ghost-red" : "secondary"), type: "button" }, label);
      b.addEventListener("click", fn);
      return b;
    }
    const draft = () => el("span", { class: "badge alt", style: "margin-inline-start:8px" }, "مسودة");
    function det(key, summary, kids) {
      const d = el("details", null, el("summary", null, summary), ...kids);
      if (openIds.has(key)) d.open = true;
      d.addEventListener("toggle", () => { if (d.open) openIds.add(key); else openIds.delete(key); });
      return d;
    }

    function build(rows) {
      const subjects = new Map();
      rows.forEach((r) => {
        if (!subjects.has(r.subject_id)) subjects.set(r.subject_id, { id: r.subject_id, name: r.subject_name, grades: new Map() });
        const sub = subjects.get(r.subject_id);
        if (!r.grade_id) return;
        if (!sub.grades.has(r.grade_id)) sub.grades.set(r.grade_id, { id: r.grade_id, name: r.grade_name, track: r.grade_track, sub: r.grade_sub, lit: r.grade_lit, units: new Map() });
        const g = sub.grades.get(r.grade_id);
        if (!r.unit_id) return;
        if (!g.units.has(r.unit_id)) g.units.set(r.unit_id, { id: r.unit_id, name: r.unit_name, order: r.unit_order, published: r.unit_published, lessons: [] });
        if (r.lesson_id) g.units.get(r.unit_id).lessons.push({ id: r.lesson_id, title: r.lesson_title, order: r.lesson_order, published: r.lesson_published, completed: r.completed });
      });
      return [...subjects.values()];
    }

    function render() {
      const out = [];
      if (canEdit) out.push(el("div", { class: "topbar" }, el("span", { class: "muted" }, "إدارة المواد والدروس"), mini("+ مادة", () => editSubject(null))));
      if (!tree.length) out.push(el("p", { class: "muted" }, canEdit ? "لا توجد مواد بعد. ابدأ بإضافة مادة." : "لا يوجد محتوى منشور لك بعد."));
      tree.forEach((sub) => {
        const gKids = [];
        if (canEdit) gKids.push(el("div", { class: "row" },
          mini("تعديل المادة", () => editSubject(sub)), mini("+ مستوى", () => editGrade(sub, null)),
          canDelete ? mini("حذف", () => del("subject", sub.id), true) : null));
        [...sub.grades.values()].forEach((g) => {
          const uKids = [];
          if (canEdit) uKids.push(el("div", { class: "row" },
            mini("تعديل المستوى", () => editGrade(sub, g)), mini("+ وحدة", () => editUnit(g, null)),
            canDelete ? mini("حذف", () => del("grade", g.id), true) : null));
          [...g.units.values()].forEach((u) => {
            const lKids = [];
            if (canEdit) lKids.push(el("div", { class: "row" },
              mini("تعديل الوحدة", () => editUnit(g, u)), mini("+ درس", () => editLesson(u, null)),
              canDelete ? mini("حذف", () => del("unit", u.id), true) : null));
            u.lessons.forEach((l) => {
              const b = el("button", { class: "pick", type: "button" }, (l.completed ? "✓ " : "") + l.title, isStaff && !l.published ? draft() : null);
              b.addEventListener("click", () => openLesson(l.id));
              lKids.push(b);
            });
            if (!u.lessons.length && !canEdit) lKids.push(el("p", { class: "muted" }, "لا توجد دروس بعد."));
            uKids.push(det("u" + u.id, [u.name, isStaff && !u.published ? draft() : null], lKids));
          });
          const audience = [g.track ? TRACK_LABEL[g.track] : null, g.sub ? SUB_LABEL[g.sub] : null, g.lit ? LIT_LABEL[g.lit] : null].filter(Boolean).join(" · ");
          gKids.push(det("g" + g.id, [g.name, audience ? el("span", { class: "badge alt", style: "margin-inline-start:8px" }, audience) : null], uKids));
        });
        out.push(det("s" + sub.id, sub.name, gKids));
      });
      box.replaceChildren(...out);
    }

    async function load() {
      box.replaceChildren(el("p", { class: "muted" }, "جاري التحميل…"));
      const { data, error } = await db.rpc("list_content");
      if (error) { box.replaceChildren(el("p", { class: "msg error" }, "تعذّر التحميل. أعد المحاولة.")); return; }
      tree = build(data);
      render();
    }
    const done = async (err, msg) => { if (err) return err; await load(); notify(msg || "تم الحفظ.", "ok"); return null; };

    function editSubject(sub) {
      swap(formView(sub ? "تعديل المادة" : "مادة جديدة",
        [{ key: "name", label: "اسم المادة", value: sub && sub.name }],
        async (v) => done((await db.rpc("save_subject", { p_id: sub ? sub.id : null, p_name: v.name })).error), load));
    }
    function editGrade(sub, g) {
      swap(formView(g ? "تعديل المستوى" : "مستوى جديد", [
        { key: "name", label: "اسم المستوى (مثل: الصف الثالث الثانوي)", value: g && g.name },
        { key: "track", label: "السياق", type: "select", value: (g && g.track) || "",
          options: [["", "للجميع"], ["scientific", "علمي"], ["literary", "أدبي"]] },
        { key: "sub", label: "التخصص العلمي (للمواد الاختيارية)", type: "select", value: (g && g.sub) || "",
          options: [["", "للجميع"], ...Object.entries(SUB_LABEL)] },
        { key: "lit", label: "المادة الاختيارية للأدبي", type: "select", value: (g && g.lit) || "",
          options: [["", "للجميع"], ...Object.entries(LIT_LABEL)] }
      ], async (v) => done((await db.rpc("save_grade", {
        p_id: g ? g.id : null, p_subject: sub.id, p_name: v.name,
        p_track: v.track || null, p_sub: v.sub || null, p_lit: v.lit || null
      })).error), load));
    }
    function editUnit(g, u) {
      swap(formView(u ? "تعديل الوحدة" : "وحدة جديدة", [
        { key: "name", label: "اسم الوحدة", value: u && u.name },
        { key: "order", label: "الترتيب", type: "number", value: u ? u.order : 0 },
        { key: "published", label: "منشورة (تظهر للطلاب)", type: "check", value: u ? u.published : false }
      ], async (v) => done((await db.rpc("save_unit", { p_id: u ? u.id : null, p_grade: g.id, p_name: v.name, p_order: v.order, p_published: v.published })).error), load));
    }
    async function editLesson(u, l) {
      let cur = null;
      if (l) {
        const r = await db.rpc("get_lesson", { p_id: l.id });
        if (r.error || !r.data || !r.data.length) return notify("تعذّر فتح الدرس للتعديل.", "error");
        cur = r.data[0];
      }
      const unitId = cur ? cur.unit_id : u.id;
      swap(formView(cur ? "تعديل الدرس" : "درس جديد", [
        { key: "title", label: "عنوان الدرس", value: cur && cur.title },
        { key: "content", label: "الشرح", type: "textarea", value: cur && cur.content,
          hint: "نص عادي. اكتب شرحك بأسلوبك من المقرر، ولا تنسخ نص الكتاب حرفياً." },
        { key: "video", label: "رابط فيديو (اختياري)", type: "url", value: cur && cur.video_url },
        { key: "pdf", label: "رابط ملف PDF (اختياري)", type: "url", value: cur && cur.pdf_url },
        { key: "order", label: "الترتيب", type: "number", value: cur ? cur.order_index : 0 },
        { key: "published", label: "منشور (يظهر للطلاب)", type: "check", value: cur ? cur.published : false }
      ], async (v) => done((await db.rpc("save_lesson", {
        p_id: cur ? cur.id : null, p_unit: unitId, p_title: v.title, p_content: v.content,
        p_video: v.video || null, p_pdf: v.pdf || null, p_order: v.order, p_published: v.published
      })).error), load));
    }
    async function del(kind, id) {
      if (!confirm("هل أنت متأكد من الحذف؟ لا يمكن التراجع.")) return;
      const { error } = await db.rpc("delete_content", { p_kind: kind, p_id: id });
      if (error) return notify(rpcError(error), "error");
      await load();
      notify("تم الحذف.", "ok");
    }

    async function openLesson(id) {
      swap(el("p", { class: "muted" }, "جاري التحميل…"));
      const { data, error } = await db.rpc("get_lesson", { p_id: id });
      if (error || !data || !data.length) return swap(el("p", { class: "msg error" }, "تعذّر فتح الدرس."));
      const l = data[0];
      const back = el("button", { class: "linkbtn", type: "button" }, "→ رجوع إلى المواد");
      back.addEventListener("click", load);
      const kids = [back, el("h2", null, l.title)];
      if (l.content) kids.push(el("div", { class: "readbox" }, l.content));
      const yid = l.video_url ? youtubeId(l.video_url) : null;
      if (yid) kids.push(el("iframe", { class: "video", src: "https://www.youtube-nocookie.com/embed/" + yid, title: "فيديو الدرس", loading: "lazy", allowfullscreen: "" }));
      else if (l.video_url && safeUrl(l.video_url)) kids.push(el("p", null, el("a", { href: safeUrl(l.video_url), target: "_blank", rel: "noopener noreferrer" }, "فتح فيديو الدرس")));
      if (l.pdf_url && safeUrl(l.pdf_url)) kids.push(el("p", null, el("a", { href: safeUrl(l.pdf_url), target: "_blank", rel: "noopener noreferrer" }, "فتح ملف PDF")));
      const paint = (b) => { b.textContent = l.completed ? "✓ مكتمل — اضغط للإلغاء" : "تعليم الدرس كمكتمل"; b.className = "btn small" + (l.completed ? " secondary" : ""); };
      const doneBtn = el("button", { type: "button" });
      paint(doneBtn);
      doneBtn.addEventListener("click", async () => {
        doneBtn.disabled = true;
        const { error: e } = await db.rpc("mark_lesson_done", { p_id: id, p_done: !l.completed });
        doneBtn.disabled = false;
        if (e) return notify(rpcError(e), "error");
        l.completed = !l.completed;
        paint(doneBtn);
      });
      kids.push(el("div", { class: "actions" }, doneBtn));
      if (canEdit) kids.push(el("div", { class: "actions" }, mini("تعديل الدرس", () => editLesson(null, l))));
      swap(el("div", null, ...kids));
    }

    await load();
    return box;
  }

  // ---------- الواجهة الهادئة للمؤسس ----------
  // مشهد عشوائي يُولَّد بأرقام فقط (لا صور خارجية): كثبان عند الغروب، أو النيل، أو ليل صحراوي
  function sceneSvg() {
    const r = (a, b) => a + Math.random() * (b - a);
    const f = (n) => n.toFixed(1);
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const W = 800, H = 320;
    const uid = "s" + Math.floor(Math.random() * 1e6);
    const dune = (base, amp, color) => {
      const wl = r(80, 150), ph = r(0, 6.28);
      let d = "M0 " + H;
      for (let x = 0; x <= W; x += 16) d += " L" + x + " " + f(base + Math.sin(x / wl + ph) * amp + Math.sin(x / (wl * 2.3) + ph * 2) * amp * 0.5);
      return '<path d="' + d + " L" + W + " " + H + ' Z" fill="' + color + '"/>';
    };
    const sky = (stops) => '<defs><linearGradient id="' + uid + 'g" x1="0" y1="0" x2="0" y2="1">' +
      stops.map((c, i) => '<stop offset="' + f(i / (stops.length - 1)) + '" stop-color="' + c + '"/>').join("") +
      '</linearGradient></defs><rect width="' + W + '" height="' + H + '" fill="url(#' + uid + 'g)"/>';
    const sun = (x, y, rad) => '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(rad * 2.2) + '" fill="#ffe2a8" opacity=".18"/>' +
      '<circle cx="' + f(x) + '" cy="' + f(y) + '" r="' + f(rad) + '" fill="#fff1cf" opacity=".95"/>';
    const palm = (x, y, sc) => {
      let fr = "";
      for (let i = 0; i < 7; i++) fr += '<path d="M0 0 Q 26 -24 60 -6 Q 30 -12 0 0Z" transform="rotate(' + f(i * 51 + r(-10, 10)) + ')"/>';
      return '<g fill="#0f1a14" transform="translate(' + f(x) + " " + f(y) + ") scale(" + f(sc) + ')">' +
        '<path d="M-3 0 C 2 -40 6 -80 2 -118 L 8 -118 C 12 -80 8 -40 5 0Z"/>' +
        '<g transform="translate(5 -118)">' + fr + "</g></g>";
    };
    const scenes = [
      () => {
        const pal = pick([["#2b1b4d", "#c2477a", "#ffb26b"], ["#1d2b64", "#f8a75d", "#ffe0a3"], ["#3a1c71", "#d76d77", "#ffaf7b"]]);
        const dp = pick([["#7a3b2e", "#4e2622", "#2c1616"], ["#8a5a3c", "#5b3a28", "#33231a"]]);
        return sky(pal) + sun(r(180, 620), r(150, 200), r(30, 46)) + dune(215, 18, dp[0]) + dune(255, 16, dp[1]) + dune(292, 12, dp[2]);
      },
      () => {
        const pal = pick([["#1d2b64", "#f8a75d", "#ffe0a3"], ["#2b1b4d", "#c2477a", "#ffb26b"], ["#243b55", "#e08a6a", "#ffd9a0"]]);
        const sx = r(240, 560);
        let s = sky(pal) + sun(sx, 178, 38);
        s += '<rect y="205" width="' + W + '" height="115" fill="' + pal[1] + '" opacity=".6"/>';
        for (let i = 0; i < 7; i++) {
          const w = r(50, 150) * (1 - i * 0.08);
          s += '<rect x="' + f(sx - w / 2) + '" y="' + f(210 + i * 14) + '" width="' + f(w) + '" height="3" rx="1.5" fill="#fff1cf" opacity="' + f(0.6 - i * 0.07) + '"/>';
        }
        s += '<path d="M0 320 L0 272 Q 200 254 400 276 T 800 264 L800 320Z" fill="#0f1a14"/>';
        s += palm(r(40, 140), 282, r(0.6, 0.95)) + palm(r(600, 760), 280, r(0.6, 0.95)) + palm(r(150, 260), 290, r(0.45, 0.7));
        return s;
      },
      () => {
        let s = sky(["#050b1f", "#0d1b3d", "#1b3a63"]);
        for (let i = 0; i < 70; i++) s += '<circle cx="' + f(r(0, W)) + '" cy="' + f(r(0, 200)) + '" r="' + f(r(0.6, 1.7)) + '" fill="#fff" opacity="' + f(r(0.35, 0.95)) + '"/>';
        const mx = r(150, 650), my = r(60, 120);
        s += '<mask id="' + uid + 'm"><rect width="' + W + '" height="' + H + '" fill="#fff"/><circle cx="' + f(mx + 14) + '" cy="' + f(my - 6) + '" r="30" fill="#000"/></mask>' +
          '<circle cx="' + f(mx) + '" cy="' + f(my) + '" r="30" fill="#fdf3d0" mask="url(#' + uid + 'm)"/>';
        return s + dune(240, 16, "#0a1530") + dune(278, 14, "#070f22") + dune(304, 10, "#040a18");
      }
    ];
    return '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مشهد هادئ">' + pick(scenes)() + "</svg>";
  }

  let homeChips = null;
  function updateHomeChips(b) {
    if (!homeChips) return;
    const items = [];
    const add = (n, text, hot) => { if (n) items.push(el("span", { class: "chip" + (hot ? " hot" : "") }, n + " " + text)); };
    add(b.fresh, "اقتراح جديد", true);
    add(b.pending, "طلب تعيين بانتظار قرارك", true);
    add(b.events, "رد على تحويلاتك", true);
    add(b.newToday, "حساب جديد اليوم", false);
    if (!items.length) items.push(el("span", { class: "chip" }, "لا شيء ينتظرك الآن."));
    homeChips.replaceChildren(...items);
  }

  function founderHome(defs, openDef) {
    const art = el("div", { class: "hero-art" });
    art.innerHTML = sceneSvg();
    const hero = el("div", { class: "hero" }, art,
      el("div", { class: "hero-text" }, crownEl(),
        el("h2", null, timeGreeting() + "، أهلاً بمؤسس لمّة"),
        el("p", null, "المنصة كلها بين يديك.")));
    homeChips = el("div", { class: "chips" });
    const tiles = el("div", { class: "tiles" });

  // ---------- الصفحة الرئيسية الهادئة للمؤسس ----------
  const PALM = '<g id="palm"><path d="M0 0 Q6 -40 0 -80" stroke="#1b1712" stroke-width="4" fill="none"/><path d="M0 -80 q-28 -6 -44 18 M0 -80 q28 -6 44 18 M0 -80 q-22 -24 -46 -10 M0 -80 q22 -24 46 -10 M0 -80 q-2 -28 -12 -40" stroke="#1b1712" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>';
  const svgWrap = (inner) => '<svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + inner + '</svg>';
  const grad = (id, stops) => '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    stops.map(([o, c]) => '<stop offset="' + o + '" stop-color="' + c + '"/>').join("") + '</linearGradient>';
  function stars(n) {
    let out = "", seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < n; i++) {
      out += '<circle cx="' + (rnd() * 800).toFixed(0) + '" cy="' + (rnd() * 210).toFixed(0) + '" r="' + (0.6 + rnd() * 1.4).toFixed(1) +
        '" fill="#fff" opacity="' + (0.4 + rnd() * 0.6).toFixed(2) + '"/>';
    }
    return out;
  }

  ];

  function founderHome(b) {
    const first = (myName || "").trim().split(/\s+/)[0];
    const scene = el("div", { class: "scene" });
    let last = -1;
    function paint() {
      let n;
      do { n = Math.floor(Math.random() * SCENES.length); } while (n === last && SCENES.length > 1);
      last = n;
      scene.innerHTML = SCENES[n]();
    }
    paint();
    const waiting = (b.fresh || 0) + (b.events || 0) + (b.pending || 0);
    const more = el("button", { class: "linkbtn", type: "button" }, "مشهد آخر");
    more.addEventListener("click", paint);
    const hero = el("div", { class: "hero" }, scene,
      el("div", { class: "hero-text" },
        el("h2", null, timeGreeting() + (first ? "، " + first : "")),
        el("p", null, waiting ? "بانتظارك " + waiting + (waiting === 1 ? " أمر" : " أمور") + " حين تشاء." : "كل شيء هادئ اليوم."),
        more));
    const tile = (label, index, count) => {
      const t = el("button", { class: "door", type: "button" }, el("strong", null, label),
        count ? el("span", { class: "badge founder" }, String(count)) : null);
      t.addEventListener("click", () => goTab(index));
      return t;
    };
    const doors = el("div", { class: "doors" },
      tile("الاقتراحات", 4, (b.fresh || 0) + (b.events || 0)),
      tile("طلبات التعيين", 3, b.pending),
      tile("الحسابات", 1, b.newToday),
      tile("المواد", 5, 0),
      tile("الحدود", 2, 0));
    const st = (n, label) => el("div", { class: "stat" }, el("b", null, n === null ? "—" : n), el("span", null, label));
    const glance = el("details", null, el("summary", null, "نظرة سريعة"),
      el("div", { class: "stats" },
        st(b.total, "إجمالي الحسابات"), st(b.newToday, "حسابات جديدة اليوم"), st(b.vacant, "مناصب شاغرة"),
        st(b.fresh, "اقتراحات جديدة"), st(b.pending, "طلبات تعيين")));
    return el("div", null, hero, doors, glance);
  }

  async function founderBriefing() {
    const out = { total: null, pending: null, fresh: null, events: null, newToday: null, vacant: null };
    try {
      const [acc, req, sug, lim] = await Promise.all([
        db.rpc("founder_list_accounts"), db.rpc("founder_list_requests"), db.rpc("list_suggestions"),
        db.from("platform_limits").select("key,value")
      ]);
      if (acc.data) {
        out.total = acc.data.length;
        out.newToday = acc.data.filter((a) => Date.now() - new Date(a.created_at).getTime() < 864e5).length;
        if (lim.data) {
          const L = Object.fromEntries(lim.data.map((l) => [l.key, l.value]));
          const cnt = (r) => acc.data.filter((a) => a.role === r).length;
          out.vacant = ["chief", "technical", "assistant"]
            .reduce((sum, r) => sum + Math.max(0, (L["max_" + r] || 0) - cnt(r)), 0);
        }
      }
      if (req.data) out.pending = req.data.filter((r) => r.status === "pending").length;
      if (sug.data) {
        out.fresh = sug.data.filter((x) => x.status === "new").length;
        out.events = sug.data.filter((x) => x.event_kind).length;
      }
    } catch (e) { /* show dashes */ }
    return out;
  }

  function founderBanner(b) {
    const stat = (n, label, hot) =>
      el("div", { class: "stat" + (hot && n > 0 ? " hot" : "") }, el("b", null, n === null ? "—" : n), el("span", null, label));
    return [
      crownEl(),
      el("h2", null, timeGreeting() + "، أهلاً بمؤسس لمّة"),
      el("p", { class: "muted", style: "margin:0" }, "المنصة كلها بين يديك."),
      el("div", { class: "stats" },
        stat(b.fresh, "اقتراحات جديدة", true),
        stat(b.pending, "طلبات بانتظار قرارك", true),
        stat(b.events, "ردود على تحويلاتك", true),
        stat(b.newToday, "حسابات جديدة اليوم", true),
        stat(b.total, "إجمالي الحسابات", false),
        stat(b.vacant, "مناصب شاغرة", false))
    ];
  }

  function supervisorNotice(n) {
    if (!n) return [];
    return [
      el("h2", null, "ردّ جديد على اقتراحك"),
      el("p", { class: "muted", style: "margin:0" },
        n === 1 ? "لديك اقتراح واحد عليه رد أو تحديث جديد." : "لديك " + n + " اقتراحات عليها ردود أو تحديثات جديدة.")
    ];
  }

  // Shown only on this device, once per login. Nothing is announced to anyone else.
  function showGate() {
    try { if (sessionStorage.getItem("gateShown")) return; sessionStorage.setItem("gateShown", "1"); } catch (e) { /* ignore */ }
    const gate = el("div", { class: "gate", role: "presentation" },
      crownEl(), el("h2", null, "أهلاً بمؤسس لمّة"), el("p", null, "المنصة في خدمتك"));
    const close = () => {
      if (!gate.isConnected) return;
      gate.classList.add("out");
      setTimeout(() => gate.remove(), 600);
    };
    gate.addEventListener("click", close);
    document.body.append(gate);
    setTimeout(close, 2300);
  }

  async function renderApp(session) {
    show("appView");
    document.body.classList.remove("calm");
    $("sectionBar").hidden = true;
    $("tabBody").hidden = false;
    $("banner").hidden = false;
    const user = session.user;
    myId = user.id;
    let name = (user.user_metadata && user.user_metadata.full_name) || "";
    let role = "student";
    canSuggest = false;
    myTrack = null;
    try {
      const r = await db.rpc("current_role_name");
      if (!r.error && r.data) role = r.data;
      const pr = await db.rpc("my_permissions");
      myPerms = (!pr.error && pr.data) || {};
      const p = await db.from("profiles").select("full_name,can_suggest,track").eq("id", user.id).maybeSingle();
      if (p.data) {
        if (p.data.full_name) name = p.data.full_name;
        canSuggest = !!p.data.can_suggest;
        myTrack = p.data.track || null;
      }
    } catch (e) { /* keep defaults */ }
    myName = name;
    const first = (name || "").trim().split(/\s+/)[0];
    const special = role === "student" && canSuggest;
    $("welcomeName").textContent = first ? "أهلاً " + first : "أهلاً بك";
    $("roleBadge").textContent = special ? "طالب مميز" : (ROLE_LABEL[role] || ROLE_LABEL.student);
    $("roleBadge").className = "badge" + (role === "founder" ? " founder" : "");
    document.body.classList.toggle("founder", role === "founder");
    currentRole = role;
    $("banner").replaceChildren();
    notify("");

    if (role === "student" && !myTrack) {
      $("tabBar").replaceChildren();
      $("tabBody").replaceChildren(trackPicker());
      return;
    }

    const contentTabDef = { label: role === "student" ? "موادي" : "المواد", render: contentTab };
    if (role === "founder") {
      const b = await founderBriefing();
      showGate();
      buildTabs([
        { label: "الرئيسية", render: async () => founderHome(await founderBriefing()) },
        { label: "الحسابات", render: accountsTab },
        { label: "الحدود", render: limitsTab },
        { label: "طلبات التعيين" + (b.pending ? " (" + b.pending + ")" : ""), render: requestsTab },
        { label: "الاقتراحات" + ((b.fresh || 0) + (b.events || 0) ? " (" + ((b.fresh || 0) + (b.events || 0)) + ")" : ""), render: () => suggestionsTab("founder") },
        contentTabDef
      ]);
    } else if (["chief", "technical", "assistant"].includes(role)) {
      const d = await db.rpc("list_suggestions");
      const list = d.data || [];
      const inbox = list.filter((x) => x.author !== myId && (x.can_claim || x.offer_for_me || x.event_kind)).length;
      const unread = list.filter((x) => x.unread).length;
      $("banner").replaceChildren(...supervisorNotice(unread));
      mineTab = 1;
      buildTabs([
        { label: "الوارد" + (inbox ? " (" + inbox + ")" : ""), render: () => suggestionsTab("inbox") },
        { label: "اقتراحاتي" + (unread ? " (" + unread + ")" : ""), render: () => suggestionsTab("mine") },
        contentTabDef
      ]);
    } else if (special) {
      const d = await db.rpc("list_suggestions");
      const unread = (d.data || []).filter((x) => x.unread).length;
      $("banner").replaceChildren(...supervisorNotice(unread));
      mineTab = 1;
      buildTabs([contentTabDef, { label: "اقتراحاتي" + (unread ? " (" + unread + ")" : ""), render: () => suggestionsTab("mine") }]);
    } else {
      buildTabs([contentTabDef]);
    }
  }

  // تحديث الأعداد والإشعارات كل دقيقة أثناء وجود المستخدم في الصفحة
  async function refreshBadges() {
    if (document.visibilityState !== "visible" || !currentRole) return;
    try {
      if (currentRole === "founder") {
        const b = await founderBriefing();
        setTabLabel(3, "طلبات التعيين" + (b.pending ? " (" + b.pending + ")" : ""));
        setTabLabel(4, "الاقتراحات" + ((b.fresh || 0) + (b.events || 0) ? " (" + ((b.fresh || 0) + (b.events || 0)) + ")" : ""));
        return;
      }
      const isSup = ["chief", "technical", "assistant"].includes(currentRole);
      if (!isSup && !canSuggest) return;
      const d = await db.rpc("list_suggestions");
      const list = d.data || [];
      const unread = list.filter((x) => x.unread).length;
      const inbox = list.filter((x) => x.author !== myId && (x.can_claim || x.offer_for_me || x.event_kind)).length;
      $("banner").replaceChildren(...supervisorNotice(unread));
      const mineLabel = "اقتراحاتي" + (unread ? " (" + unread + ")" : "");
      if (isSup) { setTabLabel(0, "الوارد" + (inbox ? " (" + inbox + ")" : "")); setTabLabel(1, mineLabel); }
      else setTabLabel(mineTab, mineLabel);
    } catch (e) { /* try again next minute */ }
  }
  setInterval(refreshBadges, 60000);
  document.addEventListener("visibilitychange", refreshBadges);

  $("homeBtn").addEventListener("click", showHome);

  $("logoutBtn").addEventListener("click", async () => {
    try { sessionStorage.removeItem("gateShown"); } catch (e) { /* ignore */ }
    await db.auth.signOut();
  });

  // ---------- توجيه الحالة ----------
  let shownUser = null;
  function route(session) {
    if (recoveryMode) { show("recoveryView"); return; }
    if (session && session.user) {
      if (shownUser === session.user.id && !$("appView").hidden) return;
      shownUser = session.user.id;
      renderApp(session);
    } else {
      shownUser = null;
      $("tabBody").replaceChildren();
      $("banner").replaceChildren();
      document.body.classList.remove("founder");
      document.body.classList.remove("calm");
      currentRole = null;
      tabDefs = [];
      show("authView");
    }
  }

  db.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") { recoveryMode = true; setTimeout(() => show("recoveryView"), 0); return; }
    if (event === "TOKEN_REFRESHED") return;
    setTimeout(() => route(session), 0);
  });

  if (hashErrorCode) {
    showMsg(hashErrorCode === "otp_expired"
      ? "انتهت صلاحية الرابط أو سبق استخدامه. سجّل الدخول، وإن لم يُؤكَّد بريدك فاطلب إعادة الإرسال."
      : "تعذّر إكمال الرابط. حاول مرة أخرى.", "error");
    $("resendBtn").hidden = false;
  }
</script>
</body>
</html>
