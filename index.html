<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لمّة</title>
<style>
  :root {
    --bg: #f3f1ea;
    --ink: #2a3a33;
    --muted: #6b7a72;
    --green: #3f7d5c;
    --red: #b5483c;
    --panel: #ebe8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17201b;
      --ink: #e8eee9;
      --muted: #9fb0a6;
      --green: #6fbf93;
      --red: #e0806f;
      --panel: #202c25;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", Arial, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main { text-align: center; max-width: 420px; }
  h1 {
    font-size: clamp(3.5rem, 14vw, 5.5rem);
    margin: 0 0 8px;
    color: var(--green);
    font-weight: 700;
    line-height: 1.2;
  }
  p { margin: 0 0 40px; font-size: 1.1rem; color: var(--muted); }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 1rem;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted);
  }
  .status.loading .dot { animation: pulse 1.2s ease-in-out infinite; }
  .status.ok .dot { background: var(--green); }
  .status.fail .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .status.loading .dot { animation: none; }
  }
  #detail {
    display: block;
    margin-top: 16px;
    font-size: .8rem;
    color: var(--muted);
    direction: ltr;
    word-break: break-word;
  }
</style>
</head>
<body>
<main>
  <h1>لمّة</h1>
  <p>منصة تعليمية سودانية — قريباً</p>
  <div id="status" class="status loading" role="status">
    <span class="dot"></span>
    <span id="msg">جاري الاتصال بالخادم…</span>
  </div>
  <small id="detail"></small>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // These two values are public and safe to keep here.
  // Never put a secret key (sb_secret_ or service_role) in this file.
  const SUPABASE_URL = "https://abdnfozkxoexcivplhcr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_PI3MB7MGuXuuXIXBEFI7ew_3MSZgiHd";

  const box = document.getElementById("status");
  const msg = document.getElementById("msg");
  const detail = document.getElementById("detail");

  async function checkConnection() {
    try {
      const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const { error } = await db
        .from("subjects")
        .select("*", { count: "exact", head: true });
      if (error) throw error;
      box.className = "status ok";
      msg.textContent = "متصل بالخادم";
    } catch (e) {
      box.className = "status fail";
      msg.textContent = "تعذّر الاتصال بالخادم";
      detail.textContent = (e && e.message) ? e.message : String(e);
    }
  }

  checkConnection();
</script>
</body>
</html>
